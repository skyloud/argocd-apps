apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-grafana-alloy
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: system-grafana-alloy
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
