name: release-charts
on:
  push:
    branches: [main, next, ci/release-charts] # ci/release-charts: testing only, removed before the PR
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-charts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      charts: ${{ steps.changed.outputs.charts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # charts whose version changed in the push, as [{chart, name, version, tag}]
      - id: changed
        run: |
          echo "charts=$(git diff --name-only --diff-filter=d -G '^version:' "$BASE" "$GITHUB_SHA" -- '*Chart.yaml' | xargs -r yq -o json -I0 '{"chart": filename | sub("/Chart.yaml$"; ""), "name": .name, "version": .version, "tag": .name + "-" + .version}' | jq -sc .)" >> "$GITHUB_OUTPUT"
        env:
          # dispatch: empty tree = all charts; new branch: vs main; otherwise: the commits of this push
          BASE: ${{ github.event_name == 'workflow_dispatch' && '4b825dc642cb6eb9a060e54bf8d69288fbee4904' || github.event.created && 'origin/main' || github.event.before }}

  release:
    needs: charts
    if: github.ref_name == 'main' && needs.charts.outputs.charts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags, Releases
      packages: write # GHCR
    strategy:
      fail-fast: false # a public.ecr.aws 429 on karpenter must not stop the other charts
      matrix:
        include: ${{ fromJSON(needs.charts.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # previous release of this chart; [v0-9]: grafana-* must not match grafana-loki-*
      - id: prev
        run: echo "tag=$(git tag -l "$NAME-[v0-9]*" --no-contains "$GITHUB_SHA" --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"
      - uses: orhun/git-cliff-action@v4.9.1
        with:
          args: --include-path ${{ matrix.chart }}/** --tag-pattern ^${{ matrix.name }}-[v0-9] --tag ${{ matrix.tag }} --strip header ${{ steps.prev.outputs.tag && format('{0}..{1}', steps.prev.outputs.tag, github.sha) }}
        env:
          OUTPUT: ${{ matrix.chart }}/RELEASE-NOTES.md
      - uses: helm/chart-releaser-action@v1.8.0
        with:
          install_only: true
      - run: cr package "$CHART"
      - run: cr upload --config .github/cr.yaml --commit "$GITHUB_SHA"
        env:
          CR_TOKEN: ${{ github.token }}
      - run: cr push --config .github/cr.yaml --username "$GITHUB_ACTOR" --password "$CR_TOKEN"
        env:
          CR_TOKEN: ${{ github.token }}

  next:
    needs: charts
    if: github.ref_name != 'main' && needs.charts.outputs.charts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # GHCR
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.charts.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
      VERSION: ${{ matrix.version }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: helm package "$CHART" --dependency-update --version "$VERSION" --destination dist
      - run: helm push dist/*.tgz "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts"
