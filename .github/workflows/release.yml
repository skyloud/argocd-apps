name: release-charts
on:
  push:
    branches: [main]
    paths:
      - "**/Chart.yaml"
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency: release-charts
jobs:
  release:
    # workflow_dispatch can target any ref: packages only come from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/chart-releaser-action@v1.8.0
        with:
          install_only: true
      - env:
          CR_TOKEN: ${{ github.token }}
          OCI: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          # one chart per call: a flaky upstream download must not block the other charts
          failed=
          for d in $(git ls-files '*Chart.yaml' | xargs dirname); do
            cr package "$d" || { sleep 30; cr package "$d"; } || failed="$failed $d"
          done
          cr upload -o "$GITHUB_REPOSITORY_OWNER" -r "${GITHUB_REPOSITORY#*/}" \
            -c "$GITHUB_SHA" --skip-existing --make-release-latest=false
          cr push --registry-url "$OCI" --username "${{ github.actor }}" \
            --password "$CR_TOKEN" --skip-existing
          if [ -n "$failed" ]; then echo "::error::packaging failed:$failed"; exit 1; fi
