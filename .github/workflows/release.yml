name: release-charts
on:
  push:
    branches: [main, next]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-charts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      charts: ${{ steps.changed.outputs.charts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # charts with a changed file in the push, as [{chart, name}]
      - id: changed
        run: |
          git diff --dirstat=files,0,cumulative "$BASE" "$GITHUB_SHA" \
            | awk '{print $2 "Chart.yaml"}' \
            | grep -Fxf <(git ls-files '*Chart.yaml') \
            | xargs -r yq -o json -I0 '{"chart": filename | sub("/Chart.yaml$"; ""), "name": .name}' \
            | jq -sc --arg tags "$(git tag -l)" "$KEEP" \
            | sed 's/^/charts=/' >> "$GITHUB_OUTPUT"
        env:
          # dispatch: empty tree = all charts; new branch: vs main; otherwise: the commits of this push
          BASE: ${{ github.event_name == 'workflow_dispatch' && '4b825dc642cb6eb9a060e54bf8d69288fbee4904' || github.event.created && 'origin/main' || github.event.before }}
          # dispatch: only charts without their first release <name>-1.0.0
          KEEP: ${{ github.event_name == 'workflow_dispatch' && 'map(select(.name + "-1.0.0" | IN($tags | splits("\n")) | not))' || '.' }}

  release:
    needs: charts
    if: github.ref_name == 'main' && needs.charts.outputs.charts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags, Releases
      packages: write # GHCR
    strategy:
      fail-fast: false # a public.ecr.aws 429 on karpenter must not stop the other charts
      matrix:
        include: ${{ fromJSON(needs.charts.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # version = last tag bumped from the chart's commits, 1.0.0 for the first release; [v0-9]: grafana-* must not match grafana-loki-*
      - id: cliff
        uses: orhun/git-cliff-action@v4.9.1
        with:
          args: --bump --unreleased --include-path ${{ matrix.chart }}/** --tag-pattern ^${{ matrix.name }}-[v0-9] --strip header
        env:
          OUTPUT: ${{ matrix.chart }}/RELEASE-NOTES.md
          GIT_CLIFF__BUMP__INITIAL_TAG: ${{ matrix.name }}-1.0.0
      # nothing to bump gives an existing tag back: fail rather than overwrite it
      - run: test -z "$(git tag -l "$TAG")"
        env:
          TAG: ${{ steps.cliff.outputs.version }}
      - uses: helm/chart-releaser-action@v1.8.0
        with:
          install_only: true
      # the version comes from the tag only, Chart.yaml is never edited
      - run: helm package "$CHART" --dependency-update --version "${TAG#"$NAME"-}" --destination .cr-release-packages
        env:
          TAG: ${{ steps.cliff.outputs.version }}
      - run: cr upload --config .github/cr.yaml --commit "$GITHUB_SHA"
        env:
          CR_TOKEN: ${{ github.token }}
      - run: cr push --config .github/cr.yaml --username "$GITHUB_ACTOR" --password "$CR_TOKEN"
        env:
          CR_TOKEN: ${{ github.token }}

  next:
    needs: charts
    if: github.ref_name != 'main' && needs.charts.outputs.charts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # GHCR
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.charts.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
      VERSION: 0.0.0-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: helm package "$CHART" --dependency-update --version "$VERSION" --destination dist
      - run: helm push dist/*.tgz "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts"
