apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
 name: {{ include "cert-issuer.fullname" . }}
 namespace: {{ .Release.Namespace }}
spec:
 acme:
   # The ACME server URL
   server: {{ .Values.defaultIssuer.acmeServer }}
   email: {{ .Values.defaultIssuer.acmeEmail }}
   # Name of a secret used to store the ACME account private key
   privateKeySecretRef:
     name: {{ .Values.defaultIssuer.privateKeySecretRef }}
   # Enable the HTTP-01 challenge provider
   solvers:
   {{- if and .Values.defaultIssuer.gatewayHTTPRoute.parentRefs (not .Values.app.config.gatewayAPI.enabled) }}
   {{- fail "defaultIssuer.gatewayHTTPRoute.parentRefs needs app.config.gatewayAPI.enabled=true" }}
   {{- end }}
   {{- with .Values.defaultIssuer.gatewayHTTPRoute.parentRefs }}
   - http01:
       gatewayHTTPRoute:
         parentRefs:
           {{- toYaml . | nindent 11 }}
   {{- else }}
   - http01:
       ingress:
         class: {{ .Values.defaultIssuer.ingressClass }}
   {{- end }}
