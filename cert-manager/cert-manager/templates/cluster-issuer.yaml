apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
 name: {{ include "cert-issuer.fullname" . }}
 namespace: {{ .Release.Namespace }}
spec:
 acme:
   # The ACME server URL
   server: {{ .Values.defaultIssuer.acme.server }}
   email: {{ .Values.defaultIssuer.acme.email }}
   # Name of a secret used to store the ACME account private key
   privateKeySecretRef:
     name: {{ .Values.defaultIssuer.privateKeySecretRef }}
   # DNS-01 when defaultIssuer.dns01 is set, HTTP-01 otherwise
   solvers:
{{- if .Values.defaultIssuer.dns01 }}
   - dns01:
       {{- toYaml .Values.defaultIssuer.dns01 | nindent 7 }}
{{- else }}
   - http01:
{{- if .Values.defaultIssuer.ingressClass }}
       ingress:
         class: {{ .Values.defaultIssuer.ingressClass }}
{{- else }}
       gatewayHTTPRoute:
         parentRefs:
           - name: {{ .Values.defaultIssuer.gateway.name }}
             namespace: {{ .Values.defaultIssuer.gateway.namespace }}
{{- end }}
{{- end }}
