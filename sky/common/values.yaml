gatewayApi:
  httpRoute:
    enabled: false
    # Parent Gateway this HTTPRoute attaches to.
    parentRefs:
      - name: default-gateway
        sectionName: http
    # Optional hostnames matched by this route.
    hostnames: []
    # Optional explicit rules. If empty, a default PathPrefix "/" rule is generated.
    rules: []
    #   - matches:
    #       - path:
    #           type: PathPrefix
    #           value: /
    #     backendRefs:
