# Each binding renders a LoadBalancer Service that the Scaleway CCM attaches to an
# existing Load Balancer (scw-loadbalancer-externally-managed): the CCM only manages
# the frontends/backends prefixed with the Service UID, never the LB itself or its IP.
# Optional keys left unset fall back to the CCM defaults.
bindings: {}
