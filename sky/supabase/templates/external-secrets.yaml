{{- /*
ExternalSecret resources (External Secrets Operator) — off by default, so the
chart stays deployable without ESO installed.

Each entry in `externalSecrets.items` renders one ExternalSecret, and so one
Kubernetes Secret: a `secretStoreRef`, a `target`, and per-key
`data[].remoteRef` pairing `key` (the secret in the backing store) with
`property` (the JSON field inside it).

Two aspects are specific to what this chart needs:

  - `items` is a LIST. Supabase consumes several distinct Secrets, not one.
  - each item takes a `namespace` and a `type`. The CNPG credentials must
    exist as `kubernetes.io/basic-auth` in BOTH this release's namespace and
    `postgres.namespace` (Kubernetes has no cross-namespace secretKeyRef), and
    CNPG rejects a Secret that isn't basic-auth.

Rendered at sync-wave -2 so ESO has populated the Secrets before the CNPG
Cluster and the app-layer Deployments — which reference them via
secretKeyRef — are applied in wave 0.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $store := .Values.externalSecrets.secretStoreRef | default dict }}
{{- if not $store.name }}
{{- fail "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled=true" }}
{{- end }}
{{- if not .Values.externalSecrets.items }}
{{- fail "externalSecrets.enabled=true but externalSecrets.items is empty - nothing would be synced" }}
{{- end }}
{{- range $item := .Values.externalSecrets.items }}
{{- if not $item.name }}
{{- fail "each externalSecrets.items entry needs a `name` (the Kubernetes Secret it produces)" }}
{{- end }}
{{- if not (or $item.data $item.dataFrom) }}
{{- fail (printf "externalSecrets item %q has neither `data` nor `dataFrom`" $item.name) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.namespace | default $.Release.Namespace }}
  labels:
    {{- include "supabase.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.externalSecrets.syncWave | quote }}
spec:
  {{- with ($item.refreshInterval | default $.Values.externalSecrets.refreshInterval) }}
  refreshInterval: {{ . }}
  {{- end }}
  secretStoreRef:
    name: {{ ($item.secretStoreRef).name | default $store.name }}
    kind: {{ ($item.secretStoreRef).kind | default $store.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $item.name }}
    creationPolicy: {{ $item.creationPolicy | default "Owner" }}
    {{- /*
    Retain by default: deleting the ExternalSecret must not take the Secret
    out from under a running Postgres cluster.
    */}}
    deletionPolicy: {{ $item.deletionPolicy | default "Retain" }}
    {{- with $item.type }}
    template:
      type: {{ . }}
    {{- end }}
  {{- with $item.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $item.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
