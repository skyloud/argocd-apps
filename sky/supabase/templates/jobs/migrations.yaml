{{- /*
Generic SQL migrations runner. Two SQL sources, both optional but at least
one required (migrations.builtinInit.enabled and/or
migrationsCode.image.reference):
  - migrations.builtinInit: chart-owned Supabase role/schema/extension
    bootstrap (files/supabase-init/), rendered as a ConfigMap - always runs
    first (mounted at /00-supabase-init).
  - migrationsCode.image.reference: your own app-level migrations, mounted
    read-only via Kubernetes ImageVolume (KEP-4639) — requires the
    `ImageVolume` feature gate on the target cluster.

Two separate ledgers, deliberately:
  - supabase_migrations.schema_migrations tracks YOUR migrations only, with
    the exact column layout the Supabase CLI creates (version/statements/
    name). Keeping it byte-compatible means `supabase migration list`,
    `db push` and `db pull` work against this self-hosted database the same
    way they worked against Supabase Cloud - the common case for a project
    migrating off Cloud with an existing supabase/migrations/ directory.
  - supabase_migrations.chart_bootstrap tracks the builtin init files. They
    live outside schema_migrations so (a) the CLI's view matches your repo
    1:1, and (b) a builtin file can never collide with an app migration that
    happens to share its version prefix (a `supabase db dump` baseline is
    commonly numbered 00000000000000_*, exactly like the builtin files).

Deliberately NOT a Helm hook: a `pre-install` hook runs before every other
resource in the SAME release, including the CNPG Cluster this Job depends on
for its superuser Secret — on a first install that Secret doesn't exist yet,
so the hook can never succeed (chicken-and-egg). Instead this is a plain Job
applied alongside everything else; it waits out Postgres's own startup with
`pg_isready` internally.

Job pod templates are immutable, so the Job needs a fresh name whenever its
SQL changes. Under `helm upgrade` that's what appendReleaseRevisionToJobName
does. Under ArgoCD it CANNOT work: ArgoCD renders with `helm template`, where
.Release.Revision is always 1, so the name never changes, the completed Job
is never replaced, and new migrations silently never apply. Set
`migrations.argocdHook=true` there instead - ArgoCD then deletes and recreates
the Job on every sync. Re-running is safe and cheap: both ledgers are
consulted per file, so already-applied migrations are skipped.
*/}}
{{- if .Values.migrations.enabled }}
{{- $dbSecret := default (include "supabase.cnpgSuperuserSecretName" .) .Values.migrations.dbSecretName }}
{{- $appSecret := default (include "supabase.cnpgAppSecretName" .) .Values.postgres.appSecret.name }}
{{- $mountPath := .Values.migrationsCode.mountPath }}
{{- $builtinInit := .Values.migrations.builtinInit.enabled }}
{{- $hasAppMigrations := ne .Values.migrationsCode.image.reference "" }}
{{- $argocdHook := .Values.migrations.argocdHook }}
{{- $vault := .Values.migrations.vaultBootstrap }}
{{- $guc := .Values.migrations.gucBootstrap }}
{{- /*
Exact version strings of the builtin bootstrap files, read from the files
themselves rather than pattern-matched, so the one-time backfill below can
never misclassify an app migration that happens to look like a builtin one.
*/}}
{{- $builtinVersions := list }}
{{- range $path, $_ := .Files.Glob "files/supabase-init/*.sql" }}
{{- $builtinVersions = append $builtinVersions (printf "'%s'" (splitList "_" (base $path) | first)) }}
{{- end }}
{{- $builtinVersionList := join ", " $builtinVersions }}
{{- if and (not $builtinInit) (not $hasAppMigrations) }}
{{- fail "migrations.enabled=true but there is nothing to run: set migrations.builtinInit.enabled=true and/or migrationsCode.image.reference" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- /*
  With the ArgoCD hook the Job is deleted before each re-creation, so the
  name stays stable (a revision suffix would be permanently "-r1" anyway).
  */}}
  name: {{ include "supabase.fullname" . }}-migrations{{- if and .Values.migrations.appendReleaseRevisionToJobName (not $argocdHook) }}-r{{ .Release.Revision }}{{- end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql-migrations
  {{- if $argocdHook }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: {{ .Values.migrations.argocdSyncWave | quote }}
  {{- end }}
spec:
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "supabase.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sql-migrations
    spec:
      restartPolicy: Never
      {{- with .Values.registryPullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "supabase.cnpgRwService" . | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: {{ include "supabase.dbName" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret | quote }}
                  key: password
            {{- if $builtinInit }}
            # Password every Supabase service already authenticates with
            # (postgres.appSecret) - used by files/supabase-init/*.sql via
            # psql's `-v apppass=... ` / `:'apppass'` substitution so it's
            # never written to a file.
            - name: PGAPPPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $appSecret | quote }}
                  key: password
            {{- end }}
            - name: MIGRATIONS_DIR
              value: {{ $mountPath | quote }}
            {{- if $builtinInit }}
            - name: SUPABASE_INIT_DIR
              value: "/00-supabase-init"
            {{- end }}
            - name: WAIT_MAX_SECONDS
              value: {{ .Values.migrations.waitForPostgresSeconds | quote }}
            {{- if and $vault.enabled $vault.supabaseKeys }}
            - name: VAULT_SUPABASE_URL
              value: {{ .Values.kong.publicUrl | default (include "supabase.internalKongUrl" .) | quote }}
            - name: VAULT_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: anonKey
            - name: VAULT_SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: serviceKey
            {{- end }}
            {{- if $vault.enabled }}
            {{- range $i, $e := $vault.extra }}
            - name: VAULT_EXTRA_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "migrations.vaultBootstrap.extra[].secretName is required" $e.secretName | quote }}
                  key: {{ required "migrations.vaultBootstrap.extra[].key is required" $e.key | quote }}
            {{- end }}
            {{- end }}
            {{- if and $guc.enabled $guc.supabaseKeys }}
            - name: GUC_SUPABASE_URL
              value: {{ .Values.kong.publicUrl | default (include "supabase.internalKongUrl" .) | quote }}
            - name: GUC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: anonKey
            {{- end }}
            {{- if $guc.enabled }}
            {{- range $i, $e := $guc.extra }}
            - name: GUC_EXTRA_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "migrations.gucBootstrap.extra[].secretName is required" $e.secretName | quote }}
                  key: {{ required "migrations.gucBootstrap.extra[].key is required" $e.key | quote }}
            {{- end }}
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo "== waiting for ${PGHOST}:${PGPORT} (max ${WAIT_MAX_SECONDS}s)"
              i=0
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                i=$((i + 2))
                if [ "$i" -ge "$WAIT_MAX_SECONDS" ]; then
                  echo "timeout waiting for postgres" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "== postgres reachable"

              {{- if $builtinInit }}
              psql_exec() { psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -v apppass="$PGAPPPASSWORD" "$@"; }
              {{- else }}
              psql_exec() { psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 "$@"; }
              {{- end }}

              psql_exec -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations;"

              {{- /*
              Exactly the DDL the Supabase CLI itself applies (version-only
              table, then two ADD COLUMN IF NOT EXISTS) so a database
              bootstrapped by this chart and one bootstrapped by
              `supabase db push` are indistinguishable to the CLI. `statements`
              stays NULL here - the CLI only reads `version` to decide what is
              pending, and storing every migration's full text a second time
              in the database buys nothing.
              */}}
              psql_exec -c "CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text NOT NULL PRIMARY KEY);"
              psql_exec -c "ALTER TABLE supabase_migrations.schema_migrations ADD COLUMN IF NOT EXISTS statements text[];"
              psql_exec -c "ALTER TABLE supabase_migrations.schema_migrations ADD COLUMN IF NOT EXISTS name text;"

              {{- if $builtinInit }}
              psql_exec -c "CREATE TABLE IF NOT EXISTS supabase_migrations.chart_bootstrap (version text NOT NULL PRIMARY KEY, name text, applied_at timestamptz NOT NULL DEFAULT now());"
              {{- /*
              Installs from before the two ledgers were split recorded the
              builtin files in schema_migrations. Move those rows across
              rather than re-running a bootstrap that is not idempotent
              (`create role supabase_admin` fails if the role exists).
              */}}
              psql_exec -c "INSERT INTO supabase_migrations.chart_bootstrap (version, name) SELECT version, name FROM supabase_migrations.schema_migrations WHERE version IN ({{ $builtinVersionList }}) ON CONFLICT (version) DO NOTHING; DELETE FROM supabase_migrations.schema_migrations WHERE version IN ({{ $builtinVersionList }});"
              {{- end }}

              {{- /*
              -L: ConfigMap volumes (the builtin bootstrap) mount files as
              symlinks into a "..data/" directory, not regular files - plain
              `find -type f` reports the symlink's own type (l) and silently
              matches nothing. -L makes `-type f` follow the link and check
              the target instead. Harmless for the ImageVolume-mounted app
              migrations, which are already regular files either way.
              */}}
              apply_dir() {
                dir=$1
                ledger=$2
                find -L "$dir" -maxdepth 1 -type f -name '*.sql' | sort | while IFS= read -r f; do
                  base=$(basename "$f" .sql)
                  version=$(printf '%s' "$base" | cut -d'_' -f1)
                  applied=$(psql_exec -tAc "SELECT 1 FROM ${ledger} WHERE version = '${version}'")
                  if [ "$applied" = "1" ]; then
                    echo "== skip $f (version $version already applied)"
                    continue
                  fi
                  echo "== applying $f (version $version)"
                  psql_exec -f "$f"
                  psql_exec -c "INSERT INTO ${ledger}(version, name) VALUES ('${version}', '$(basename "$f")');"
                  echo "== applied $f"
                done
              }

              {{- if $guc.enabled }}
              {{- /*
              Posé AVANT les migrations, contrairement au bootstrap Vault plus
              bas : `ALTER DATABASE ... SET` ne change rien à la session en
              cours, mais apply_dir lance un psql par fichier, donc une
              session neuve qui voit le réglage. Une migration peut ainsi lire
              la valeur au moment où elle s'applique — ce qui compte pour du
              SQL migré de Cloud qui génère une valeur aléatoire quand il n'en
              trouve aucune.

              Le NOM du paramètre vient du chart (littéral rendu par Helm), sa
              VALEUR passe par :'gval' pour que psql produise un littéral
              correctement échappé : ni le nom ni la valeur ne transitent par
              la ligne de commande. Rejoué à chaque sync, idempotent.
              */}}
              guc_put() {
                if [ -z "${2:-}" ]; then
                  echo "== database GUC $1 skipped (empty value)" >&2
                  return 0
                fi
                printf '%s\n' "ALTER DATABASE \"$PGDATABASE\" SET $1 = :'gval';" \
                  | psql_exec -v gval="$2" -f - >/dev/null
                echo "== database GUC $1 set"
              }
              {{- if $guc.supabaseKeys }}
              guc_put app.supabase_url "$GUC_SUPABASE_URL"
              guc_put app.supabase_anon_key "$GUC_SUPABASE_ANON_KEY"
              {{- end }}
              {{- range $i, $e := $guc.extra }}
              guc_put {{ required "migrations.gucBootstrap.extra[].name is required" $e.name | quote }} "$GUC_EXTRA_{{ $i }}"
              {{- end }}
              {{- end }}

              {{- if $builtinInit }}
              apply_dir "$SUPABASE_INIT_DIR" supabase_migrations.chart_bootstrap
              {{- end }}
              {{- if $hasAppMigrations }}
              apply_dir "$MIGRATIONS_DIR" supabase_migrations.schema_migrations
              {{- end }}

              {{- if $vault.enabled }}
              {{- /*
              Vault secrets are upserted AFTER migrations, because the
              supabase_vault extension is created by them, and because a
              trigger added by a migration may read a secret on its very
              first firing. Keyed by name (delete + create): every reader
              looks secrets up by name via vault.decrypted_secrets, and
              rewriting them each run is what lets a rotated JWT Secret or a
              changed kong.publicUrl actually reach the database.
              */}}
              if [ "$(psql_exec -tAc "SELECT 1 FROM pg_extension WHERE extname = 'supabase_vault'")" != "1" ]; then
                echo "== supabase_vault not installed - skipping vault bootstrap" >&2
              else
                {{- /*
                Fed on stdin rather than with -c. psql only performs :'var'
                interpolation on input it lexes itself; -c is documented as
                taking a string with "no psql-specific features" and hands it
                to the server verbatim, so :'vname' reaches Postgres literally
                and fails with `syntax error at or near ":"`. Reading from
                stdin restores the substitution, and --single-transaction
                restores what a single -c gave for free: a failing
                create_secret rolls the delete back instead of leaving the
                secret missing.

                Values still never touch the command line or a file - :'vsecret'
                does the literal quoting server-side, so a JWT containing a
                quote or a backslash cannot break out of the statement.
                */}}
                vault_put() {
                  printf '%s\n' \
                    "DELETE FROM vault.secrets WHERE name = :'vname';" \
                    "SELECT vault.create_secret(:'vsecret', :'vname', 'managed by the supabase Helm chart');" \
                    | psql_exec -v vname="$1" -v vsecret="$2" --single-transaction -f - \
                      >/dev/null
                  echo "== vault secret $1 set"
                }
                {{- if $vault.supabaseKeys }}
                vault_put SUPABASE_URL "$VAULT_SUPABASE_URL"
                vault_put SUPABASE_ANON_KEY "$VAULT_SUPABASE_ANON_KEY"
                vault_put SUPABASE_SERVICE_ROLE_KEY "$VAULT_SUPABASE_SERVICE_ROLE_KEY"
                {{- end }}
                {{- range $i, $e := $vault.extra }}
                vault_put {{ $e.name | quote }} "$VAULT_EXTRA_{{ $i }}"
                {{- end }}
              fi
              {{- end }}

              echo "== migrations complete"
          volumeMounts:
            {{- if $builtinInit }}
            - name: supabase-init
              mountPath: /00-supabase-init
              readOnly: true
            {{- end }}
            {{- if $hasAppMigrations }}
            - name: migrations-code
              mountPath: {{ $mountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if $builtinInit }}
        - name: supabase-init
          configMap:
            name: {{ include "supabase.fullname" . }}-supabase-init
        {{- end }}
        {{- if $hasAppMigrations }}
        - name: migrations-code
          image:
            reference: {{ .Values.migrationsCode.image.reference | quote }}
            pullPolicy: {{ .Values.migrationsCode.image.pullPolicy }}
        {{- end }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
