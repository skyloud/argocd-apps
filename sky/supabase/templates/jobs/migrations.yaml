{{- /*
Generic SQL migrations runner. Two SQL sources, both optional but at least
one required (migrations.builtinInit.enabled and/or
migrationsCode.image.reference):
  - migrations.builtinInit: chart-owned Supabase role/schema/extension
    bootstrap (files/supabase-init/), rendered as a ConfigMap - always sorts
    first (mounted at /00-supabase-init).
  - migrationsCode.image.reference: your own app-level migrations, mounted
    read-only via Kubernetes ImageVolume (KEP-4639) — requires the
    `ImageVolume` feature gate on the target cluster.

Deliberately NOT a Helm hook: a `pre-install` hook runs before every other
resource in the SAME release, including the CNPG Cluster this Job depends on
for its superuser Secret — on a first install that Secret doesn't exist yet,
so the hook can never succeed (chicken-and-egg). Instead this is a plain Job
applied alongside everything else; it waits out Postgres's own startup with
`pg_isready` internally, same as the app-layer Deployments settle in via
their normal crash-loop-until-ready startup. Job pod templates are
immutable, so the name includes the release revision to avoid "field is
immutable" errors on `helm upgrade` when the migrations image changes.

Job pod templates are immutable, so the Job needs a fresh name whenever its
SQL changes. Under `helm upgrade` that's what appendReleaseRevisionToJobName
does. Under ArgoCD it CANNOT work: ArgoCD renders with `helm template`, where
.Release.Revision is always 1, so the name never changes, the completed Job
is never replaced, and new migrations silently never apply. Set
`migrations.argocdHook=true` there instead - ArgoCD then deletes and recreates
the Job on every sync. Re-running is safe and cheap: both ledgers are
consulted per file, so already-applied migrations are skipped.
*/}}
{{- if .Values.migrations.enabled }}
{{- $dbSecret := default (include "supabase.cnpgSuperuserSecretName" .) .Values.migrations.dbSecretName }}
{{- $appSecret := default (include "supabase.cnpgAppSecretName" .) .Values.postgres.appSecret.name }}
{{- $mountPath := .Values.migrationsCode.mountPath }}
{{- $builtinInit := .Values.migrations.builtinInit.enabled }}
{{- $hasAppMigrations := ne .Values.migrationsCode.image.reference "" }}
{{- $argocdHook := .Values.migrations.argocdHook }}
{{- $vault := .Values.migrations.vaultBootstrap }}
{{- /*
Exact version strings of the builtin bootstrap files, read from the files
themselves rather than pattern-matched, so the one-time backfill below can
never misclassify an app migration that happens to look like a builtin one.
*/}}
{{- $builtinVersions := list }}
{{- range $path, $_ := .Files.Glob "files/supabase-init/*.sql" }}
{{- $builtinVersions = append $builtinVersions (printf "'%s'" (splitList "_" (base $path) | first)) }}
{{- end }}
{{- $builtinVersionList := join ", " $builtinVersions }}
{{- if and (not $builtinInit) (not $hasAppMigrations) }}
{{- fail "migrations.enabled=true but there is nothing to run: set migrations.builtinInit.enabled=true and/or migrationsCode.image.reference" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "supabase.fullname" . }}-migrations{{- if .Values.migrations.appendReleaseRevisionToJobName }}-r{{ .Release.Revision }}{{- end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql-migrations
  {{- if $argocdHook }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: {{ .Values.migrations.argocdSyncWave | quote }}
  {{- end }}
spec:
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "supabase.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sql-migrations
    spec:
      restartPolicy: Never
      {{- with .Values.registryPullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "supabase.cnpgRwService" . | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: {{ include "supabase.dbName" . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret | quote }}
                  key: password
            {{- if $builtinInit }}
            # Password every Supabase service already authenticates with
            # (postgres.appSecret) - used by files/supabase-init/*.sql via
            # psql's `-v apppass=... ` / `:'apppass'` substitution so it's
            # never written to a file.
            - name: PGAPPPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $appSecret | quote }}
                  key: password
            {{- end }}
            - name: MIGRATIONS_DIR
              value: {{ $mountPath | quote }}
            {{- if $builtinInit }}
            # Leading "00-" guarantees this sorts before $MIGRATIONS_DIR
            # ("/migrations") in the `find | sort` below - "m" < "s"
            # alphabetically, which would otherwise run app migrations
            # before the role/schema bootstrap they depend on.
            - name: SUPABASE_INIT_DIR
              value: "/00-supabase-init"
            {{- end }}
            - name: WAIT_MAX_SECONDS
              value: {{ .Values.migrations.waitForPostgresSeconds | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo "== waiting for ${PGHOST}:${PGPORT} (max ${WAIT_MAX_SECONDS}s)"
              i=0
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                i=$((i + 2))
                if [ "$i" -ge "$WAIT_MAX_SECONDS" ]; then
                  echo "timeout waiting for postgres" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "== postgres reachable"

              {{- if $builtinInit }}
              psql_exec() { psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -v apppass="$PGAPPPASSWORD" "$@"; }
              {{- else }}
              psql_exec() { psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 "$@"; }
              {{- end }}

              psql_exec -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations;"
              psql_exec -c "CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text PRIMARY KEY, name text, applied_at timestamptz NOT NULL DEFAULT now());"

              {{- /*
              -L: ConfigMap volumes (the builtin bootstrap) mount files as
              symlinks into a "..data/" directory, not regular files - plain
              `find -type f` reports the symlink's own type (l) and silently
              matches nothing. -L makes `-type f` follow the link and check
              the target instead. Harmless for the ImageVolume-mounted app
              migrations, which are already regular files either way.
              */}}
              {{- if $builtinInit }}
              find -L "$SUPABASE_INIT_DIR" "$MIGRATIONS_DIR" -maxdepth 1 -type f -name '*.sql' 2>/dev/null | sort | while IFS= read -r f; do
              {{- else }}
              find -L "$MIGRATIONS_DIR" -maxdepth 1 -type f -name '*.sql' | sort | while IFS= read -r f; do
              {{- end }}
                base=$(basename "$f" .sql)
                version=$(printf '%s' "$base" | cut -d'_' -f1)
                applied=$(psql_exec -tAc "SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '${version}'")
                if [ "$applied" = "1" ]; then
                  echo "== skip $f (version $version already applied)"
                  continue
                fi
                echo "== applying $f (version $version)"
                psql_exec -f "$f"
                psql_exec -c "INSERT INTO supabase_migrations.schema_migrations(version, name) VALUES ('${version}', '$(basename "$f")');"
                echo "== applied $f"
              done

              echo "== migrations complete"
          volumeMounts:
            {{- if $builtinInit }}
            - name: supabase-init
              mountPath: /00-supabase-init
              readOnly: true
            {{- end }}
            {{- if $hasAppMigrations }}
            - name: migrations-code
              mountPath: {{ $mountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if $builtinInit }}
        - name: supabase-init
          configMap:
            name: {{ include "supabase.fullname" . }}-supabase-init
        {{- end }}
        {{- if $hasAppMigrations }}
        - name: migrations-code
          image:
            reference: {{ .Values.migrationsCode.image.reference | quote }}
            pullPolicy: {{ .Values.migrationsCode.image.pullPolicy }}
        {{- end }}
        {{- if and (not $builtinInit) (not $hasAppMigrations) }}
        {{- fail "migrations.enabled=true but there is nothing to run: set migrations.builtinInit.enabled=true and/or migrationsCode.image.reference" }}
        {{- end }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
