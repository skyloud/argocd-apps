{{- /*
PostgREST — REST API auto-generated from the Postgres schema. Routed through
PgDog (reads/writes split automatically via BEGIN READ ONLY/WRITE).
*/}}
{{- if .Values.rest.enabled -}}
{{- $svc := dict "root" . "svc" "rest" -}}
{{- $fullname := include "supabase.svcFullname" $svc -}}
{{- if .Values.rest.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.svcServiceAccountName" $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
  {{- with .Values.rest.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
  {{- with .Values.rest.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.rest.service.type }}
  ports:
    - port: {{ .Values.rest.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "supabase.svcSelectorLabels" $svc | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
spec:
  {{- if not .Values.rest.autoscaling.enabled }}
  replicas: {{ .Values.rest.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "supabase.svcSelectorLabels" $svc | nindent 6 }}
  template:
    metadata:
      {{- with .Values.rest.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.svcSelectorLabels" $svc | nindent 8 }}
    spec:
      {{- with (default .Values.registryPullSecrets .Values.rest.image.pullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.svcServiceAccountName" $svc }}
      {{- with .Values.rest.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rest
          {{- with .Values.rest.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.rest.image.repository }}:{{ .Values.rest.image.tag }}"
          imagePullPolicy: {{ .Values.rest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # DB via PgDog (automatic read/write split). Prepared statements off:
            # not reliably safe across PgDog's transaction-mode pooling.
            - name: DB_HOST
              value: {{ include "supabase.svcFullname" (dict "root" . "svc" "pgdog") | quote }}
            - name: DB_USER
              value: authenticator
            - name: DB_PORT
              value: "5432"
            - name: DB_DRIVER
              value: postgres
            - name: DB_SSL
              value: disable
            - name: PGRST_DB_SCHEMAS
              value: {{ .Values.rest.dbSchemas | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ .Values.rest.dbAnonRole | quote }}
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: "false"
            - name: PGRST_APP_SETTINGS_JWT_EXP
              value: {{ .Values.auth.jwtExpiry | default 3600 | quote }}
            - name: PGRST_DB_PREPARED_STATEMENTS
              value: "false"
            {{- with .Values.rest.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.cnpgAppSecretName" . | quote }}
                  key: password
            - name: DB_NAME
              value: {{ include "supabase.dbName" . | quote }}
            - name: PGRST_DB_URI
              value: "$(DB_DRIVER)://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(DB_SSL)"
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: secret
            - name: PGRST_APP_SETTINGS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: secret
            {{- if .Values.jwtApiKeys.name }}
            - name: PGRST_JWT_SECRET_IS_BASE64
              value: "false"
            {{- end }}
          {{- with .Values.rest.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.rest.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.rest.livenessProbe | nindent 12 }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{- if .Values.rest.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.rest.readinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- end }}
          {{- with .Values.rest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.rest.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.rest.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rest.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rest.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rest.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.rest.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}
  minReplicas: {{ .Values.rest.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.rest.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.rest.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.rest.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.rest.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.rest.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
