{{- /*
Supabase Studio — admin dashboard. Talks to postgres-meta for schema
browsing and directly to the CNPG primary for a couple of features that
need a raw connection string.
*/}}
{{- if .Values.studio.enabled -}}
{{- $svc := dict "root" . "svc" "studio" -}}
{{- $fullname := include "supabase.svcFullname" $svc -}}
{{- if .Values.studio.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.svcServiceAccountName" $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
  {{- with .Values.studio.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
  {{- with .Values.studio.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.studio.service.type }}
  ports:
    - port: {{ .Values.studio.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "supabase.svcSelectorLabels" $svc | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
spec:
  replicas: {{ .Values.studio.replicaCount }}
  selector:
    matchLabels:
      {{- include "supabase.svcSelectorLabels" $svc | nindent 6 }}
  template:
    metadata:
      {{- with .Values.studio.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.svcSelectorLabels" $svc | nindent 8 }}
    spec:
      {{- with (default .Values.registryPullSecrets .Values.studio.image.pullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.svcServiceAccountName" $svc }}
      {{- with .Values.studio.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: studio
          {{- with .Values.studio.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.studio.image.repository }}:{{ .Values.studio.image.tag }}"
          imagePullPolicy: {{ .Values.studio.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOSTNAME
              value: "::"
            - name: STUDIO_PORT
              value: "3000"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_HOST
              value: {{ include "supabase.cnpgRwService" . | quote }}
            - name: DEFAULT_ORGANIZATION_NAME
              value: {{ .Values.studio.organizationName | quote }}
            - name: DEFAULT_PROJECT_NAME
              value: {{ .Values.studio.projectName | quote }}
            - name: NEXT_ANALYTICS_BACKEND_PROVIDER
              value: postgres
            {{- if .Values.studio.functionsCodeVolume.enabled }}
            - name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER
              value: {{ .Values.functionsCode.mountPath | quote }}
            {{- end }}
            {{- with .Values.kong.publicUrl }}
            - name: SUPABASE_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.kong.enabled }}
            - name: SUPABASE_URL
              value: {{ include "supabase.internalKongUrl" . | quote }}
            {{- end }}
            {{- if .Values.meta.enabled }}
            - name: STUDIO_PG_META_URL
              value: {{ include "supabase.internalMetaUrl" . | quote }}
            {{- end }}
            - name: POSTGRES_DB
              value: {{ include "supabase.dbName" . | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.cnpgAppSecretName" . | quote }}
                  key: password
            {{- if .Values.meta.enabled }}
            - name: PG_META_CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.secret.name" (dict "root" . "cfg" .Values.meta.encryptionSecret "auto" "meta") | quote }}
                  key: cryptoKey
            {{- end }}
            {{- if .Values.studio.openAi.name }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studio.openAi.name | quote }}
                  key: apiKey
            {{- else }}
            - name: OPENAI_API_KEY
              value: "disabled"
            {{- end }}
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: anonKey
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: serviceKey
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.jwtSecretName" . | quote }}
                  key: secret
            {{- with .Values.studio.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.studio.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.studio.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.studio.livenessProbe | nindent 12 }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: /api/platform/profile
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- end }}
          {{- with .Values.studio.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.studio.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with .Values.studio.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.studio.functionsCodeVolume.enabled }}
            - name: functions-code
              mountPath: {{ .Values.functionsCode.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- with .Values.studio.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.studio.functionsCodeVolume.enabled }}
        - name: functions-code
          image:
            reference: {{ required "functionsCode.image.reference is required when studio.functionsCodeVolume.enabled=true" .Values.functionsCode.image.reference | quote }}
            pullPolicy: {{ .Values.functionsCode.image.pullPolicy }}
        {{- end }}
      {{- with .Values.studio.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.studio.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.studio.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
