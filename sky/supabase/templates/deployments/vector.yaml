{{- /*
Vector — tails every other service's container logs (source `kubernetes_logs`)
and ships them to Analytics (Logflare), split by container name into the
exact Logflare source names Studio's Logs Explorer queries (hardcoded there -
see https://github.com/supabase/supabase/blob/master/docker/volumes/logs/vector.yml).
Pipeline shape (project_logs -> route by .appname -> per-service enrichment)
ported from the official Kubernetes-native chart, supabase-community/
supabase-kubernetes charts/supabase/files/vector/vector.yml: Logflare derives
its own top-level "event_message" from an incoming "message" field on
ingest, silently ignoring any custom "event_message" a sink sends alongside
it - project_logs below moves message -> event_message exactly once so the
two never collide, and every per-service transform after that only adds to
`.metadata`, never touches event_message again. Per-service parsing is
matched against real log output of each image pinned in this chart's
values.yaml, not guessed - GoTrue/storage-api log flat JSON (logrus/pino),
CNPG's instance manager wraps every Postgres line as JSON with the real
message under `.record.message`, Kong/PostgREST/Realtime log plain text.

Runs as a DaemonSet: `kubernetes_logs` reads /var/log/pods on the node the
pod is scheduled to, so a Deployment would only ever see one node's logs.
`vector.tolerations` must cover every node pool you want logs from.
*/}}
{{- if .Values.vector.enabled -}}
{{- if not .Values.analytics.enabled }}
{{- fail "vector.enabled=true requires analytics.enabled=true (Vector's sinks point at the in-cluster Analytics/Logflare service)." }}
{{- end }}
{{- $svc := dict "root" . "svc" "vector" -}}
{{- $fullname := include "supabase.svcFullname" $svc -}}
{{- $tokensSecret := include "supabase.analyticsTokensName" . -}}
{{- $analyticsUrl := include "supabase.internalAnalyticsUrl" . -}}
{{- if .Values.vector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.svcServiceAccountName" $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
  {{- with .Values.vector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-read
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-read
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "supabase.svcServiceAccountName" $svc }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      kubernetes_logs:
        type: kubernetes_logs
        extra_namespace_label_selector: "kubernetes.io/metadata.name in ({{ .Release.Namespace }}{{ if include "supabase.postgresNamespaceIsSeparate" . }},{{ include "supabase.postgresNamespace" . }}{{ end }})"

    transforms:
      # Ported from the official supabase-community/supabase-kubernetes
      # vector.yml: Logflare derives its own top-level "event_message" from
      # whatever "message" field is present on ingest, so the two can't
      # coexist without Logflare silently overriding any custom
      # "event_message" you set (verified against the real Analytics
      # backend - this bit us before this transform was added). Move
      # message -> event_message and container_name -> appname exactly
      # once, up front, and never touch either field again downstream.
      project_logs:
        type: remap
        inputs: [kubernetes_logs]
        source: |
          .event_message = del(.message)
          .appname = del(.kubernetes.container_name)
          del(.file)
          del(.kubernetes)
          del(.source_type)
          del(.stream)

      route_by_service:
        type: route
        inputs: [project_logs]
        # Matched against each service's actual container `name:` (see
        # templates/deployments/<svc>.yaml) via dedicated per-service name
        # helpers rather than hand-copied literals - stays in sync
        # automatically if a container's name ever changes.
        route:
          kong: '.appname == {{ include "supabase.kong.name" . | quote }}'
          auth: '.appname == {{ include "supabase.auth.name" . | quote }}'
          rest: '.appname == {{ include "supabase.rest.name" . | quote }}'
          realtime: '.appname == {{ include "supabase.realtime.name" . | quote }}'
          storage: '.appname == {{ include "supabase.storage.name" . | quote }}'
          functions: '.appname == {{ include "supabase.functions.name" . | quote }}'
          db: '.appname == {{ include "supabase.db.name" . | quote }}'

      # Kong: nginx combined-log-format access lines on stdout.
      kong_logs:
        type: remap
        inputs: ["route_by_service.kong"]
        source: |
          .metadata = parse_regex(.event_message, r'^(?P<client_ip>\S+) \S+ \S+ \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<path>[^ "]+)[^"]*" (?P<status>\d+) (?P<bytes>\d+)') ?? {}

      # GoTrue: one flat JSON object per line (logrus) - {"level","msg","time",...}.
      auth_logs:
        type: remap
        inputs: ["route_by_service.auth"]
        source: |
          parsed, err = parse_json(.event_message)
          if err == null {
            .metadata = object!(parsed)
          }

      # PostgREST: plain "<timestamp>: <message>" text, nothing structured to parse.
      rest_logs:
        type: remap
        inputs: ["route_by_service.rest"]
        source: |
          .

      realtime_logs:
        type: remap
        inputs: ["route_by_service.realtime"]
        source: |
          .metadata = parse_regex(.event_message, r'\[(?P<level>\w+)\]') ?? {}

      # storage-api: one flat JSON object per line (pino) - {"level","msg","time",...}.
      storage_logs:
        type: remap
        inputs: ["route_by_service.storage"]
        source: |
          parsed, err = parse_json(.event_message)
          if err == null {
            .metadata = object!(parsed)
          }

      functions_logs:
        type: remap
        inputs: ["route_by_service.functions"]
        source: |
          .

      # CNPG's instance manager wraps every Postgres log line as JSON, the
      # real message lives at .record.message / .record.error_severity -
      # enrich .metadata with it but leave event_message as the raw line,
      # same treatment as every other structured source above.
      db_logs:
        type: remap
        inputs: ["route_by_service.db"]
        source: |
          parsed, err = parse_json(.event_message)
          if err == null {
            .metadata = object!(parsed)
            if exists(.metadata.record.error_severity) {
              .metadata.severity = downcase(to_string(.metadata.record.error_severity) ?? "log")
            }
          }

    sinks:
      logflare_kong:
        type: http
        inputs: [kong_logs]
        encoding:
          codec: json
        method: post
        request:
          retry_max_duration_secs: 30
          retry_initial_backoff_secs: 1
          headers:
            x-api-key: "${LOGFLARE_PUBLIC_ACCESS_TOKEN}"
        uri: "{{ $analyticsUrl }}/api/logs?source_name=cloudflare.logs.prod"
      logflare_auth:
        type: http
        inputs: [auth_logs]
        encoding:
          codec: json
        method: post
        request:
          retry_max_duration_secs: 30
          retry_initial_backoff_secs: 1
          headers:
            x-api-key: "${LOGFLARE_PUBLIC_ACCESS_TOKEN}"
        uri: "{{ $analyticsUrl }}/api/logs?source_name=gotrue.logs.prod"
      logflare_rest:
        type: http
        inputs: [rest_logs]
        encoding:
          codec: json
        method: post
        request:
          retry_max_duration_secs: 30
          retry_initial_backoff_secs: 1
          headers:
            x-api-key: "${LOGFLARE_PUBLIC_ACCESS_TOKEN}"
        uri: "{{ $analyticsUrl }}/api/logs?source_name=postgREST.logs.prod"
      logflare_realtime:
        type: http
        inputs: [realtime_logs]
        encoding:
          codec: json
        method: post
        request:
          retry_max_duration_secs: 30
          retry_initial_backoff_secs: 1
          headers:
            x-api-key: "${LOGFLARE_PUBLIC_ACCESS_TOKEN}"
        uri: "{{ $analyticsUrl }}/api/logs?source_name=realtime.logs.prod"
      logflare_storage:
        type: http
        inputs: [storage_logs]
        encoding:
          codec: json
        method: post
        request:
          retry_max_duration_secs: 30
          retry_initial_backoff_secs: 1
          headers:
            x-api-key: "${LOGFLARE_PUBLIC_ACCESS_TOKEN}"
        uri: "{{ $analyticsUrl }}/api/logs?source_name=storage.logs.prod.2"
      logflare_functions:
        type: http
        inputs: [functions_logs]
        encoding:
          codec: json
        method: post
        request:
          retry_max_duration_secs: 30
          retry_initial_backoff_secs: 1
          headers:
            x-api-key: "${LOGFLARE_PUBLIC_ACCESS_TOKEN}"
        uri: "{{ $analyticsUrl }}/api/logs?source_name=deno-relay-logs"
      logflare_db:
        type: http
        inputs: [db_logs]
        encoding:
          codec: json
        method: post
        request:
          retry_max_duration_secs: 30
          retry_initial_backoff_secs: 1
          headers:
            x-api-key: "${LOGFLARE_PUBLIC_ACCESS_TOKEN}"
        uri: "{{ $analyticsUrl }}/api/logs?source_name=postgres.logs"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "supabase.svcSelectorLabels" $svc | nindent 6 }}
  template:
    metadata:
      {{- with .Values.vector.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.svcSelectorLabels" $svc | nindent 8 }}
    spec:
      {{- with (default .Values.registryPullSecrets .Values.vector.image.pullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.svcServiceAccountName" $svc }}
      {{- with .Values.vector.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vector
          {{- with .Values.vector.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.vector.image.repository }}:{{ .Values.vector.image.tag }}"
          imagePullPolicy: {{ .Values.vector.image.pullPolicy }}
          args:
            - --config
            - /etc/vector/vector.yaml
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOGFLARE_PUBLIC_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $tokensSecret | quote }}
                  key: publicAccessToken
            {{- with .Values.vector.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.vector.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: api
              containerPort: 8686
              protocol: TCP
          {{- with .Values.vector.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.vector.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
            - name: var-log
              mountPath: /var/log/
              readOnly: true
            - name: var-lib
              mountPath: /var/lib/
              readOnly: true
            {{- with .Values.vector.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.vector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log/
        - name: var-lib
          hostPath:
            path: /var/lib/
        {{- with .Values.vector.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.vector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
