{{- /*
Analytics (Logflare) — self-hosted single-tenant log backend for Studio's
Logs Explorer. Env var contract follows the official self-host reference:
https://github.com/supabase/supabase/blob/master/docker/docker-compose.logs.yml

Connects as `supabase_admin` (superuser, created by the built-in bootstrap -
see files/supabase-init/) directly on the CNPG primary (DB_HOST direct, not
through PgDog - schema/database creation is DDL-heavy at first boot), into
its own `_supabase` database and `_analytics` schema - both created by the
built-in bootstrap, matching official self-host convention (a dedicated
database for internal state, separate from the app database everything
else in this chart uses).
*/}}
{{- if .Values.analytics.enabled -}}
{{- $svc := dict "root" . "svc" "analytics" -}}
{{- $fullname := include "supabase.svcFullname" $svc -}}
{{- $tokensSecret := include "supabase.analyticsTokensName" . -}}
{{- if .Values.analytics.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.svcServiceAccountName" $svc }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
  {{- with .Values.analytics.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
  {{- with .Values.analytics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.analytics.service.type }}
  ports:
    - port: {{ .Values.analytics.service.port }}
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    {{- include "supabase.svcSelectorLabels" $svc | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
spec:
  replicas: {{ .Values.analytics.replicaCount }}
  selector:
    matchLabels:
      {{- include "supabase.svcSelectorLabels" $svc | nindent 6 }}
  template:
    metadata:
      {{- with .Values.analytics.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "supabase.svcSelectorLabels" $svc | nindent 8 }}
    spec:
      {{- with (default .Values.registryPullSecrets .Values.analytics.image.pullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "supabase.svcServiceAccountName" $svc }}
      {{- with .Values.analytics.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: analytics
          {{- with .Values.analytics.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.analytics.image.repository }}:{{ .Values.analytics.image.tag }}"
          imagePullPolicy: {{ .Values.analytics.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: LOGFLARE_NODE_HOST
              value: 127.0.0.1
            - name: DB_USERNAME
              value: supabase_admin
            - name: DB_HOSTNAME
              value: {{ include "supabase.cnpgRwService" . | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_SCHEMA
              value: _analytics
            - name: POSTGRES_BACKEND_SCHEMA
              value: _analytics
            # DB_DATABASE/DB_PASSWORD must precede POSTGRES_BACKEND_URL: K8s
            # only resolves `$(VAR)` for variables defined earlier in the
            # same container's env list.
            #
            # `_supabase` (not this chart's main app database) matches
            # official self-host convention (docker/volumes/db/logs.sql) -
            # a dedicated database for internal-only state, created by the
            # built-in bootstrap (see files/supabase-init/).
            - name: DB_DATABASE
              value: "_supabase"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "supabase.cnpgAppSecretName" . | quote }}
                  key: password
            - name: POSTGRES_BACKEND_URL
              value: postgresql://supabase_admin:$(DB_PASSWORD)@$(DB_HOSTNAME):$(DB_PORT)/$(DB_DATABASE)
            - name: LOGFLARE_SINGLE_TENANT
              value: "true"
            - name: LOGFLARE_SUPABASE_MODE
              value: "true"
            - name: LOGFLARE_FEATURE_FLAG_OVERRIDE
              value: multibackend=true
            - name: LOGFLARE_PUBLIC_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $tokensSecret | quote }}
                  key: publicAccessToken
            - name: LOGFLARE_PRIVATE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $tokensSecret | quote }}
                  key: privateAccessToken
            {{- with .Values.analytics.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.analytics.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.analytics.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.analytics.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.analytics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.analytics.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.analytics.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.analytics.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.analytics.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.analytics.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
