{{- /*
Realtime encryption Secret — `secretKeyBase` (Phoenix/Erlang signing key for
cookies/tokens). Rendered only when `realtime.encryptionSecret.name` is not
supplied (bring-your-own). Persisted across upgrades via `lookup` so
sessions/tokens aren't invalidated on every `helm upgrade`.
*/}}
{{- if .Values.realtime.enabled -}}
{{- $svc := dict "root" . "svc" "realtime" -}}
{{- if include "supabase.secret.autoGenerated" (dict "cfg" .Values.realtime.encryptionSecret) }}
{{- $secretName := include "supabase.secret.name" (dict "root" . "cfg" .Values.realtime.encryptionSecret "auto" "realtime") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  secretKeyBase: {{ index $existing.data "secretKeyBase" }}
  {{- else }}
  secretKeyBase: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
