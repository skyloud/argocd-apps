{{- /*
postgres-meta encryption Secret — `cryptoKey` (used by postgres-meta to
encrypt stored connection passwords). Rendered only when
`meta.encryptionSecret.name` is not supplied (bring-your-own). Persisted
across upgrades via `lookup`.

`lookup` ONLY WORKS under a real `helm install/upgrade` against a live
cluster. Under anything that renders with `helm template` — ArgoCD, `helm
diff`, CI — it returns nothing, so this key is re-randomised on every render
and postgres-meta can no longer decrypt what it stored under the previous
one. Supply `meta.encryptionSecret.name` there instead.
*/}}
{{- if .Values.meta.enabled -}}
{{- $svc := dict "root" . "svc" "meta" -}}
{{- if include "supabase.secret.autoGenerated" (dict "cfg" .Values.meta.encryptionSecret) }}
{{- $secretName := include "supabase.secret.name" (dict "root" . "cfg" .Values.meta.encryptionSecret "auto" "meta") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  cryptoKey: {{ index $existing.data "cryptoKey" }}
  {{- else }}
  cryptoKey: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
