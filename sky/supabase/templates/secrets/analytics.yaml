{{- /*
Analytics (Logflare) tenant tokens — `publicAccessToken` / `privateAccessToken`.
Plain UUID v4 (not cryptographic secrets), used by self-hosted Logflare in
single-tenant mode: the public token is what Vector authenticates log writes
with, the private token is what Studio uses to query them back out. Persisted
via `lookup` across upgrades - regenerating them would orphan the tenant
Logflare already created and Studio would lose its log connection.
*/ -}}
{{- if .Values.analytics.enabled -}}
{{- $svc := dict "root" . "svc" "analytics" -}}
{{- $name := include "supabase.analyticsTokensName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $publicToken := "" -}}
{{- $privateToken := "" -}}
{{- if and $existing $existing.data (index $existing.data "publicAccessToken") -}}
{{- $publicToken = index $existing.data "publicAccessToken" -}}
{{- else -}}
{{- $publicToken = uuidv4 | b64enc -}}
{{- end -}}
{{- if and $existing $existing.data (index $existing.data "privateAccessToken") -}}
{{- $privateToken = index $existing.data "privateAccessToken" -}}
{{- else -}}
{{- $privateToken = uuidv4 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supabase.svcLabels" $svc | nindent 4 }}
type: Opaque
data:
  publicAccessToken: {{ $publicToken | quote }}
  privateAccessToken: {{ $privateToken | quote }}
{{- end }}
