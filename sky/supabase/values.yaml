  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
