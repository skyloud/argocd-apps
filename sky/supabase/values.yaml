# =============================================================================
# Supabase (generic self-host chart)
# -----------------------------------------------------------------------------
# Deploys: CloudNativePG Postgres cluster, PgDog pooler (primary + read-replica
# routing), PostgREST, GoTrue (auth), Realtime, Storage API, postgres-meta,
# Studio, Kong, imgproxy, Edge Functions runtime, and a generic SQL migrations
# runner Job.
#
# Image tags below are PLACEHOLDERS to illustrate the expected format — pin
# them to tested upstream releases (or wire up Renovate) before deploying.
#
# Two things you MUST supply yourself (not generated by this chart):
#   - `jwt.secretName` : a Secret with keys `secret` (HMAC signing secret),
#     `anonKey`, `serviceKey` (standard Supabase JWTs signed with that secret).
#   - `functionsCode.image.reference` / `migrationsCode.image.reference` :
#     OCI images containing your Edge Functions code and SQL migration files,
#     mounted read-only via Kubernetes ImageVolume (KEP-4639). Requires the
#     `ImageVolume` feature gate enabled on the target cluster (beta/GA
#     depending on Kubernetes version — verify before relying on it).
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# imagePullSecrets shared by every workload in this chart unless a service
# defines its own `<svc>.image.pullSecrets`.
registryPullSecrets: []

# =============================================================================
# Postgres — CloudNativePG
# -----------------------------------------------------------------------------
# Requires the CloudNativePG operator installed on the target cluster
# (CRD postgresql.cnpg.io/v1). This chart renders a single `Cluster` CR.
# `instances` = 1 primary + (instances-1) read replicas. Scale this to add
# replicas; PgDog (below) automatically routes reads to them. Replica pods
# schedule onto whatever capacity the cluster autoscaler (e.g. Karpenter)
# provisions — no chart-side autoscaling of Postgres itself.
# =============================================================================
postgres:
  # Application database name. Fixed Supabase convention — every official
  # Supabase service assumes `postgres` unless you override every service's
  # DB env yourself. Leave default unless you know why you're changing it.
  database: ""
  # Pre-existing CNPG "app" Secret (basic-auth: username/password). Empty =
  # CNPG default naming `{cluster}-app`.
  appSecret:
    name: ""
  # Empty (default) = the CNPG Cluster lives in this release's own
  # namespace, same as everything else. Set to place Postgres in a
  # different namespace instead.
  #
  # This chart does NOT create that namespace, and does NOT bridge Secrets
  # across namespaces — Kubernetes has no cross-namespace secretKeyRef, so
  # whoever generates the Postgres credentials (Terraform, typically) needs
  # to create an IDENTICAL Secret (same name, same `username`/`password`
  # keys) in both this namespace and `postgres.namespace`, and this chart's
  # `postgres.appSecret.name` / `cnpg.superuserSecret.name` need to point at
  # it. See README "Postgres in its own namespace".
  namespace: ""

cnpg:
  enabled: true
  # CNPG Cluster CR name. Empty = `{Release.Name}-postgres`.
  name: ""
  apiVersion: postgresql.cnpg.io/v1
  # 1 primary + 2 read replicas by default.
  instances: 3
  # switchover (vs. CNPG's default `restart`): on upgrade, CNPG promotes an
  # already-updated replica before restarting the primary — near-zero write
  # downtime. Requires instances > 1 to have any effect.
  primaryUpdateMethod: switchover
  image:
    # supabase/postgres + a 1-line uid fix (26, the Debian/PGDG convention
    # CNPG's instance manager hardcodes) so it boots under CNPG - see
    # docker/postgres/Dockerfile. Ships pg_cron/pg_net/supabase_vault/pgmq/
    # pgjwt/pg_graphql/pgsodium out of the box, which the built-in migration
    # bootstrap (files/supabase-init/) uses when present. Verified against a
    # real 2-instance CNPG cluster (initdb + streaming replication) before
    # publishing. Override with a vanilla ghcr.io/cloudnative-pg/postgresql
    # image if you don't need those extensions - the bootstrap SQL checks
    # pg_available_extensions before creating any of them.
    repository: ghcr.io/skyloud/supabase-postgres
    # CNPG rejects unpinned tags (`latest`) via its admission webhook —
    # always pin a specific version.
    tag: "17.6.1.160"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  enableSuperuserAccess: true
  superuserSecret:
    name: ""
  bootstrap:
    initdb:
      secret:
        name: ""
  # Keeps the "app" role's password in sync with postgres.appSecret /
  # bootstrap.initdb.secret AFTER first bootstrap. Without this, CNPG only
  # ever reads that Secret once (at initdb) — rotating it externally (e.g. an
  # ExternalSecret backed by AWS Secrets Manager) then updates the Kubernetes
  # Secret and every consuming service, but the Postgres role itself keeps
  # the OLD password, so auth fails everywhere at once. (The superuser
  # credential does not need this: cnpg.superuserSecret is already watched
  # continuously by the operator.)
  #
  # Declares `login` and `passwordSecret` ONLY — deliberately no `inRoles`,
  # so CNPG does not also try to reconcile role membership. That is owned by
  # files/supabase-init/ (see its role-membership grants), and CNPG taking it
  # over here would fight that bootstrap SQL.
  managedRoles:
    enabled: false
  postgresql:
    # pg_cron and pg_net are load-time extensions: `CREATE EXTENSION pg_cron`
    # ERRORS OUT unless pg_cron is preloaded here, and pg_net's CREATE
    # EXTENSION succeeds but its background worker never starts, so
    # net.http_* calls queue forever without being sent. Both are extremely
    # common in migrations exported from Supabase Cloud (scheduled jobs,
    # webhooks/triggers calling Edge Functions), so both are preloaded by
    # default.
    #
    # This default assumes the default `cnpg.image` (which ships them). If
    # you point cnpg.image at a vanilla ghcr.io/cloudnative-pg/postgresql
    # image, EMPTY THIS LIST — Postgres refuses to start when asked to
    # preload a library the image doesn't contain, which is a hard boot
    # failure rather than a skipped feature.
    sharedPreloadLibraries:
      - pg_cron
      - pg_net
    parameters:
      # pg_cron stores its job table in exactly one database, which must be
      # named here (it defaults to `postgres`, matching supabase.dbName).
      cron.database_name: postgres
      # Run cron jobs in background workers instead of opening a libpq TCP
      # connection to localhost. CNPG's generated pg_hba requires
      # scram-sha-256 for every TCP connection, but pg_cron connects with no
      # password — so with the default (`off`) every tick fails auth and NO
      # job ever runs, silently.
      cron.use_background_workers: "on"
      max_connections: "300"
      shared_buffers: "512MB"
      work_mem: "8MB"
      maintenance_work_mem: "256MB"
      effective_cache_size: "1536MB"
      # Required by Realtime (CDC via logical replication).
      wal_level: logical
      max_wal_senders: "10"
      max_replication_slots: "10"
  # ---------------------------------------------------------------------------
  # pgaudit — session (and optionally object) audit logging.
  # ---------------------------------------------------------------------------
  # OFF by default, deliberately: with `pgaudit.log = all, -misc` every
  # statement PostgREST runs is written to the instance's log, which on a
  # read-heavy API is considerably more log volume than every application
  # container combined. Turn it on knowing where the records go and what that
  # storage costs.
  #
  # Everything below is handled natively by the CNPG operator, which treats the
  # mere PRESENCE of `pgaudit.*` parameters as the switch (see its "PGAudit
  # Logs" doc section). Setting `enabled: true` here is enough — the operator
  # then:
  #   - adds `pgaudit` to shared_preload_libraries (and removes it again when
  #     the parameters go away), which is why this chart does not list it in
  #     cnpg.postgresql.sharedPreloadLibraries and you should not either;
  #   - runs CREATE EXTENSION pgaudit in every database in the cluster that
  #     accepts connections (and DROP EXTENSION on disable), so nothing is
  #     needed in files/supabase-init/ for this.
  # Preloading a library changes shared_preload_libraries, which requires a
  # Postgres restart — CNPG performs it as a rolling restart
  # (primaryUpdateMethod above), so expect one brief primary switchover when
  # you flip this.
  #
  # Records are written to the instance's stderr; CNPG parses the pgaudit CSV
  # and re-emits it on the pod's stdout as JSON with `.logger` = "pgaudit",
  # `.msg` = "record", and the audit fields under `.record.audit`
  # (audit_type/class/command/statement/parameter/...) alongside the usual
  # user_name/database_name/session_id. Anything already collecting container
  # logs (this chart's Vector DaemonSet, a cluster-wide Fluent Bit / CloudWatch
  # agent, ...) therefore picks them up with no further wiring, and
  # `.logger == "pgaudit"` is the field to filter on downstream. Never set
  # `pgaudit.log_directory`: it diverts records to files inside the pod, where
  # nothing collects them and they die with the pod.
  pgaudit:
    enabled: false
    # Merged into cnpg.postgresql.parameters above; a key set in both places
    # takes its value from `parameters` (the explicit escape hatch wins).
    parameters:
      # Classes to record. `all, -misc` = every class (READ, WRITE, FUNCTION,
      # ROLE, DDL, MISC_SET) except MISC (DISCARD/FETCH/CHECKPOINT/VACUUM).
      # READ is by far the most expensive one here — dropping to
      # "write, ddl, role" keeps the compliance-relevant trail (who changed
      # what, who was granted what) at a small fraction of the volume.
      pgaudit.log: "all, -misc"
      # Skip statements that only touch pg_catalog. PostgREST re-introspects
      # the schema on every schema-cache reload and Studio/postgres-meta query
      # the catalog constantly, so with this `on` catalog reads dominate the
      # audit trail while saying nothing about access to application data.
      pgaudit.log_catalog: "off"
      # One record per relation touched rather than one per statement (a join
      # across 3 tables produces 3 records), which is what makes "who read
      # this table" answerable by filtering rather than by parsing SQL text.
      pgaudit.log_relation: "on"
      # OFF deliberately: `on` writes bind-parameter VALUES into the audit
      # trail. That is often precisely what an audit wants, but it also means
      # every argument a client passes to an RPC lands in whatever store these
      # logs are archived to. Turn it on only if that store is treated as
      # holding sensitive data.
      pgaudit.log_parameter: "off"
  storage:
    size: 50Gi
    storageClass: ""
  monitoring:
    # Requires the monitoring.coreos.com/v1 CRDs (Prometheus Operator).
    enablePodMonitor: false
  backup:
    enabled: false
    # Name of a pre-deployed ObjectStore CR (barmancloud.cnpg.io/v1).
    objectName: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  annotations: {}
  labels: {}

# =============================================================================
# PgDog — SQL-aware pooler/router in front of the CNPG cluster.
# -----------------------------------------------------------------------------
# Detects `BEGIN READ ONLY` / `BEGIN READ WRITE` (as sent by PostgREST based
# on function volatility) and routes accordingly: reads -> replicas, writes
# -> primary. Targets: PostgREST, Storage API, postgres-meta. Auth (pgx +
# transaction-pooling incompatibility) and Realtime (replication slots) and
# Edge Functions/migrations (long transactions, DDL) connect directly to the
# primary instead.
# =============================================================================
pgdog:
  enabled: true
  replicaCount: 2
  # PgDog's own listen port (internal). The Service always exposes 5432 so
  # DB_HOST/DB_PORT overrides on consumers stay drop-in compatible.
  port: 6432
  loadBalancingStrategy: "round_robin"
  # false = every query (including PostgREST's `BEGIN READ ONLY`) is routed
  # to the primary — no replica node declared at all. Requires
  # `cnpg.instances > 1` to have any effect when true.
  useReadReplicas: true
  # PgDog defaults to `include_primary`, which load-balances reads across
  # the primary AND replicas — not what "route reads to replicas" implies.
  # `exclude_primary` reserves the primary for writes only, as intended by
  # this chart's whole read/write-split design.
  readWriteSplit: "exclude_primary"
  # 0 = auto (number of available cores).
  workers: 0
  # LISTEN/NOTIFY backlog (used by Storage API).
  pubSubChannelSize: 4096
  extraGeneral: {}
  # Pool size per Postgres role. These are real Postgres connections PgDog
  # opens per (user, db) — keep the sum aligned with
  # `cnpg.postgresql.parameters.max_connections`. These four role names are
  # the standard Supabase Postgres roles — your migrations' bootstrap SQL
  # must create them (see README "Bootstrapping Supabase roles").
  pools:
    authenticator: 60
    supabaseAdmin: 10
    supabaseAuthAdmin: 15
    supabaseStorageAdmin: 15
    postgres: 5
  image:
    repository: ghcr.io/pgdogdev/pgdog
    tag: "v0.1.52"
    pullPolicy: IfNotPresent
  # Renders users.toml from Secrets at pod start (never written to a ConfigMap
  # in plaintext).
  initImage:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  appDbSecretName: ""
  superuserSecretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  livenessProbe:
    tcpSocket:
      port: pgdog
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: pgdog
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    # HPA scaling behavior (autoscaling/v2), e.g. a long
    # stabilizationWindowSeconds to damp scale-down. Passed through as-is.
    behavior: {}

# =============================================================================
# Edge Functions code / SQL migrations — mounted via Kubernetes ImageVolume.
# -----------------------------------------------------------------------------
# Build these as plain OCI images (`FROM scratch` + COPY your files, or any
# base — only the filesystem is used) and push them to any registry this
# cluster can pull from. No PVC, no custom application image required.
# =============================================================================
functionsCode:
  image:
    # Required. e.g. registry.example.com/myorg/supabase-functions:1.0.0
    reference: ""
    pullPolicy: Always
  # Path inside the functions container where the image's filesystem lands.
  # Layout expected: one directory per function, each with an `index.ts`
  # (e.g. `<mountPath>/hello-world/index.ts`) — i.e. exactly the contents of
  # a Supabase CLI project's `supabase/functions/` directory.
  mountPath: /home/deno/functions
  # Optional shared import map applied to every function that does not carry
  # its own `deno.json` / `deno.jsonc`. Path is inside the mounted image, so
  # a repo-root `import_map.json` copied alongside the functions would be
  # `/home/deno/functions/import_map.json`. Empty = none.
  # (Per-function `deno.json` is detected automatically and always wins.)
  importMapPath: ""

migrationsCode:
  image:
    # Required only if you have your OWN app-level migrations to run (on top
    # of the built-in Supabase bootstrap below). e.g.
    # registry.example.com/myorg/supabase-migrations:1.0.0
    reference: ""
    pullPolicy: Always
  # Path inside the migrations Job where the image's filesystem lands.
  # Layout expected: flat directory of `<version>_<name>.sql` files, applied
  # in lexicographic order, alongside (after, by filename sort) the built-in
  # bootstrap files below.
  mountPath: /migrations

# =============================================================================
# Migrations runner — generic SQL runner. Built-in Supabase role/schema
# bootstrap (see migrations.builtinInit below) runs first; your own
# `migrationsCode` image's app-level migrations run after, in the same Job.
# -----------------------------------------------------------------------------
# A plain Job (NOT a Helm hook — see templates/jobs/migrations.yaml for why),
# applied alongside the rest of the release. Your migrations are tracked in
# `supabase_migrations.schema_migrations` using the exact column layout the
# Supabase CLI creates, so `supabase migration list` / `db push` / `db pull`
# keep working against this database — the builtin bootstrap is tracked
# separately in `supabase_migrations.chart_bootstrap` to keep the CLI's view
# identical to your repo. Re-running is a no-op once a migration has applied.
# Connects directly to the CNPG primary with the superuser role (DDL/role
# creation cannot go through PgDog's transaction pooling).
# =============================================================================
migrations:
  enabled: true
  # Bakes the official Supabase role/schema/extension bootstrap (roles,
  # auth/storage schemas, pg_cron/pg_net/vault/pgmq/pg_graphql if the
  # Postgres image has them) into a chart-owned ConfigMap, applied first in
  # the migrations Job - see files/supabase-init/ and README "Bootstrapping
  # Supabase roles". Every statement that depends on an extension checks
  # pg_available_extensions first, so this is safe to leave enabled even
  # against a vanilla ghcr.io/cloudnative-pg/postgresql image (it just skips
  # what isn't available). Set to false to fully bring your own bootstrap
  # via migrationsCode instead.
  builtinInit:
    enabled: true
  image:
    # Any image with `psql` + a POSIX shell. Debian-based `postgres` images
    # include bash; if you swap to an Alpine-based image, the runner script
    # is plain POSIX sh so it still works.
    repository: postgres
    tag: "16-bookworm"
    pullPolicy: IfNotPresent
  # Superuser Secret (basic-auth, key `password`). Empty = CNPG default
  # `{cluster}-superuser`.
  dbSecretName: ""
  waitForPostgresSeconds: 300
  # Job pod templates are immutable — if true (default), the Job name
  # includes the Helm release revision so `helm upgrade` (e.g. bumping
  # migrationsCode.image.reference) creates a fresh Job instead of failing
  # with "field is immutable". Old completed Jobs are garbage-collected via
  # ttlSecondsAfterFinished.
  appendReleaseRevisionToJobName: true
  # REQUIRED when this chart is deployed by ArgoCD (or anything else that
  # renders with `helm template`): .Release.Revision is always 1 there, so
  # `appendReleaseRevisionToJobName` produces the same Job name forever, the
  # completed Job is never replaced, and new migrations silently never run.
  # `true` annotates the Job as an ArgoCD `Sync` hook with
  # hook-delete-policy=BeforeHookCreation, so ArgoCD deletes and recreates it
  # on every sync. Safe to re-run: applied versions are skipped.
  # Do NOT combine with a real `helm install/upgrade` that already manages
  # Helm hooks itself.
  argocdHook: false
  # Sync wave for the hook above. Negative values run it before the app-layer
  # Deployments in the same sync; the Job waits for Postgres internally either
  # way, so this only affects how long PostgREST/Studio serve a pre-migration
  # schema on a first install.
  argocdSyncWave: "0"
  # -----------------------------------------------------------------------
  # Supabase Vault bootstrap — off by default.
  #
  # Enable this if your SQL calls Edge Functions from the database (a trigger
  # or a pg_cron job doing `net.http_post(...)`), which is the standard
  # Supabase Cloud pattern. Those statements read their target URL and API
  # key out of `vault.decrypted_secrets` by name, and Cloud has them
  # populated out-of-band — via the dashboard or the Management API — so they
  # are NOT in your migrations and a self-hosted database starts without
  # them. Every such trigger then fails at runtime.
  #
  # Runs after migrations (supabase_vault is created by them) and rewrites
  # the secrets on every run, so rotating the JWT Secret or changing
  # kong.publicUrl propagates into the database.
  vaultBootstrap:
    enabled: false
    # Upsert SUPABASE_URL (kong.publicUrl, or the in-cluster Kong URL when
    # unset), SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY from this
    # release's own JWT Secret.
    supabaseKeys: true
    # Additional vault secrets, each sourced from an existing K8s Secret key.
    # Use this for project-specific names your SQL expects, e.g. a worker
    # token a cron job authenticates with:
    #   - name: email_queue_service_role_key
    #     secretName: supabase-jwt
    #     key: serviceKey
    extra: []
  # -----------------------------------------------------------------------
  # GUC bootstrap — off by default. Même besoin que vaultBootstrap ci-dessus,
  # autre mécanisme : pose les valeurs comme paramètres de configuration de la
  # BASE (`ALTER DATABASE ... SET`) au lieu de secrets Vault.
  #
  # À utiliser quand le Vault n'est pas exploitable — typiquement une image
  # Postgres dont `vault.getkey_script` est câblé par son propre
  # postgresql.conf, que CloudNativePG ignore : `vault.create_secret()` échoue
  # alors en « pgsodium_derive: no server secret key defined » et tout SQL qui
  # lit `vault.decrypted_secrets` repart les mains vides. Un GUC n'est pas
  # chiffré au repos et reste lisible par toute session (`current_setting`,
  # `pg_db_role_setting`) : ne l'utiliser que pour des valeurs de
  # configuration, JAMAIS pour une clé de service. L'URL publique et la clé
  # anon (« publishable ») qualifient ; une service key non.
  #
  # Contrairement à vaultBootstrap, ceci tourne AVANT les migrations : chaque
  # fichier est appliqué par un nouveau processus psql, donc une nouvelle
  # session, qui voit le réglage posé au niveau base. Une migration peut ainsi
  # lire la valeur pendant qu'elle s'applique.
  #
  # ATTENTION : un même paramètre posé au niveau RÔLE (`ALTER ROLE ... SET`) a
  # PRÉCÉDENCE sur le niveau base. Si un de ces noms est déjà épinglé sur
  # `authenticator` / `authenticated` / `service_role`, ce bootstrap n'aura
  # aucun effet visible — vérifier `pg_db_role_setting` avant de conclure.
  gucBootstrap:
    enabled: false
    # Pose `app.supabase_url` (kong.publicUrl, ou l'URL Kong interne à défaut)
    # et `app.supabase_anon_key` (Secret JWT du release). Ce sont les noms
    # attendus par du SQL migré de Supabase Cloud qui doit continuer à appeler
    # ses Edge Functions sans Vault.
    supabaseKeys: true
    # Paramètres additionnels, valeur lue dans une clé d'un Secret existant.
    # Le nom doit être qualifié (`prefixe.nom`) : Postgres n'accepte un
    # paramètre inconnu que sous cette forme.
    #   - name: app.encryption_key
    #     secretName: supabase-app-keys
    #     key: encryptionKey
    extra: []
  ttlSecondsAfterFinished: 86400
  # Keep retrying: on first install the pod may sit in
  # CreateContainerConfigError for a bit until the CNPG Cluster (applied in
  # the same release) finishes creating its Secrets — that's expected, not a
  # real failure.
  backoffLimit: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []

# =============================================================================
# External Secrets Operator — optional, off by default so the chart still
# deploys on a cluster without ESO.
#
# Every Secret this chart consumes is bring-your-own (see the table below).
# Enabling this makes the chart render the ExternalSecret resources that
# produce them, instead of you creating each one with `kubectl create secret`.
#
# Each item renders one ExternalSecret, and so one Kubernetes Secret, pairing
# `secretKey` (the key written into the Secret) with a `remoteRef` naming the
# secret in the backing store and the JSON `property` inside it.
#
# What Supabase expects, and the exact keys each Secret must carry:
#
#   Secret                | keys                                    | type
#   ----------------------|-----------------------------------------|-----------
#   jwt.secretName        | secret, anonKey, serviceKey             | Opaque
#   realtime.encryption…  | secretKeyBase                           | Opaque
#   meta.encryptionSecret | cryptoKey                               | Opaque
#   analytics.tokensSec…  | publicAccessToken, privateAccessToken   | Opaque
#   CNPG app secret       | username, password                      | basic-auth
#   CNPG superuser secret | username, password                      | basic-auth
#
# The two CNPG Secrets need `type: kubernetes.io/basic-auth` (CNPG rejects
# anything else) AND a copy in `postgres.namespace` when Postgres is split out
# — list the same item twice with different `namespace` values, since
# Kubernetes has no cross-namespace secretKeyRef.
#
# The anon/service JWTs cannot be machine-generated from the outside: they are
# HS256 tokens that must be signed with the same `secret`. Author those three
# together in one Secrets Manager entry.
# =============================================================================
externalSecrets:
  enabled: false
  # Applied to every item unless the item overrides it.
  secretStoreRef:
    name: aws-secrets-manager-secret-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  # Negative so ESO has written the Secrets before the CNPG Cluster and the
  # Deployments that secretKeyRef them are applied (wave 0).
  syncWave: "-2"
  items: []
  #  - name: supabase-jwt
  #    # namespace: ""            # empty = this release's namespace
  #    # type: Opaque             # omit for Opaque; kubernetes.io/basic-auth for CNPG
  #    data:
  #      - secretKey: secret      # key written into the Kubernetes Secret
  #        remoteRef:
  #          key: supabase-jwt    # AWS Secrets Manager secret name
  #          property: secret     # JSON property inside it
  #      - secretKey: anonKey
  #        remoteRef: { key: supabase-jwt, property: anonKey }
  #      - secretKey: serviceKey
  #        remoteRef: { key: supabase-jwt, property: serviceKey }

# =============================================================================
# JWT — bring your own. Generate an HMAC secret + anon/service JWTs with any
# standard Supabase self-host JWT generator, store as a Secret with keys
# `secret` / `anonKey` / `serviceKey`, and point `jwt.secretName` at it
# (External Secrets / Sealed Secrets / kubectl — this chart doesn't mint it).
# =============================================================================
jwt:
  secretName: ""

# Optional asymmetric API keys (publishable/secret key pattern). Empty = HMAC
# keys only (jwt.secretName above). Fixed key contract if you do provide one:
# `jwtKeys`, `jwtJwks`, `supabasePublishableKey`, `supabaseSecretKey`.
jwtApiKeys:
  name: ""

# SMTP — shared by GoTrue (auth emails) and, if you enable it, Edge Functions.
# `enabled: false` (default): no mail sending configured anywhere.
smtp:
  enabled: false
  host: ""
  port: 587
  from: ""
  fromName: ""
  # Secret (basic-auth: username/password). Empty = no SMTP auth.
  secretName: ""

# App-level Secret whose keys are exposed as env vars to Edge Functions via
# `envFrom` (Stripe keys, third-party API keys, etc). Empty = not mounted.
config:
  secretName: ""

# =============================================================================
# Kong — single HTTP entrypoint (/rest/v1, /auth/v1, /storage/v1,
# /realtime/v1, /functions/v1, /pg).
# =============================================================================
kong:
  enabled: true
  # Container name override (default "<chart-name>-kong") - also what
  # Vector's log router matches against, see templates/deployments/vector.yaml.
  nameOverride: ""
  replicaCount: 1
  # Publicly reachable URL of the Kong gateway (e.g. https://api.example.com).
  # Consumed by Auth (API_EXTERNAL_URL) and Studio (SUPABASE_PUBLIC_URL) as the
  # single source of truth for "how do external clients reach this API".
  # Empty = falls back to the in-cluster Service URL (fine for Studio/internal
  # use, but Auth email links/OAuth redirects need a real public URL).
  publicUrl: ""
  image:
    repository: kong
    tag: "3.8"
    pullPolicy: IfNotPresent
    pullSecrets: []
  # Upstream timeouts in ms for the two routes whose requests legitimately run
  # long. Kong's built-in default is 60s and it closes the connection itself,
  # so the caller gets a 504 while the upstream logs show a request that
  # completed fine.
  timeouts:
    # Empty = track `functions.workerTimeoutMs`, so the gateway never cuts in
    # before the function worker's own deadline. Set a number to decouple them.
    functions: null
    # Large multipart uploads/downloads through /storage/v1. Keep this at or
    # above the time a client needs to push `storage.fileSizeLimit` bytes over
    # the slowest link you care about.
    storage: 300000
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  ingress:
    enabled: false
    className: ""
    # Left empty on purpose — this chart stays ingress-controller-agnostic.
    #
    # But note that ingress controllers impose their own body-size and timeout
    # limits IN FRONT of Kong, and their defaults are far below what Supabase
    # needs: ingress-nginx caps request bodies at 1MB, so every upload larger
    # than that fails with a 413 no matter what `storage.fileSizeLimit` says,
    # and its 60s read timeout truncates long Edge Function calls. Whichever
    # controller you use, raise both. For ingress-nginx:
    #
    #   nginx.ingress.kubernetes.io/proxy-body-size: "500m"   # >= storage.fileSizeLimit
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "300" # >= kong.timeouts.functions / 1000
    #   nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    #
    # For Traefik, the equivalents live on the IngressRoute/Middleware
    # (buffering maxRequestBodyBytes, forwardingTimeouts) rather than here.
    annotations: {}
    hosts: []
    tls: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    # HPA scaling behavior (autoscaling/v2), e.g. a long
    # stabilizationWindowSeconds to damp scale-down. Passed through as-is.
    behavior: {}

