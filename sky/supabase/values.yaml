# =============================================================================
# Supabase (generic self-host chart)
# -----------------------------------------------------------------------------
# Deploys: CloudNativePG Postgres cluster, PgDog pooler (primary + read-replica
# routing), PostgREST, GoTrue (auth), Realtime, Storage API, postgres-meta,
# Studio, Kong, imgproxy, Edge Functions runtime, and a generic SQL migrations
# runner Job.
#
# Image tags below are PLACEHOLDERS to illustrate the expected format — pin
# them to tested upstream releases (or wire up Renovate) before deploying.
#
# Two things you MUST supply yourself (not generated by this chart):
#   - `jwt.secretName` : a Secret with keys `secret` (HMAC signing secret),
#     `anonKey`, `serviceKey` (standard Supabase JWTs signed with that secret).
#   - `functionsCode.image.reference` / `migrationsCode.image.reference` :
#     OCI images containing your Edge Functions code and SQL migration files,
#     mounted read-only via Kubernetes ImageVolume (KEP-4639). Requires the
#     `ImageVolume` feature gate enabled on the target cluster (beta/GA
#     depending on Kubernetes version — verify before relying on it).
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# imagePullSecrets shared by every workload in this chart unless a service
# defines its own `<svc>.image.pullSecrets`.
registryPullSecrets: []

# =============================================================================
# Postgres — CloudNativePG
# -----------------------------------------------------------------------------
# Requires the CloudNativePG operator installed on the target cluster
# (CRD postgresql.cnpg.io/v1). This chart renders a single `Cluster` CR.
# `instances` = 1 primary + (instances-1) read replicas. Scale this to add
# replicas; PgDog (below) automatically routes reads to them. Replica pods
# schedule onto whatever capacity the cluster autoscaler (e.g. Karpenter)
# provisions — no chart-side autoscaling of Postgres itself.
# =============================================================================
postgres:
  # Application database name. Fixed Supabase convention — every official
  # Supabase service assumes `postgres` unless you override every service's
  # DB env yourself. Leave default unless you know why you're changing it.
  database: ""
  # Pre-existing CNPG "app" Secret (basic-auth: username/password). Empty =
  # CNPG default naming `{cluster}-app`.
  appSecret:
    name: ""
  # Empty (default) = the CNPG Cluster lives in this release's own
  # namespace, same as everything else. Set to place Postgres in a
  # different namespace instead.
  #
  # This chart does NOT create that namespace, and does NOT bridge Secrets
  # across namespaces — Kubernetes has no cross-namespace secretKeyRef, so
  # whoever generates the Postgres credentials (Terraform, typically) needs
  # to create an IDENTICAL Secret (same name, same `username`/`password`
  # keys) in both this namespace and `postgres.namespace`, and this chart's
  # `postgres.appSecret.name` / `cnpg.superuserSecret.name` need to point at
  # it. See README "Postgres in its own namespace".
  namespace: ""

cnpg:
  enabled: true
  # CNPG Cluster CR name. Empty = `{Release.Name}-postgres`.
  name: ""
  apiVersion: postgresql.cnpg.io/v1
  # 1 primary + 2 read replicas by default.
  instances: 3
  # switchover (vs. CNPG's default `restart`): on upgrade, CNPG promotes an
  # already-updated replica before restarting the primary — near-zero write
  # downtime. Requires instances > 1 to have any effect.
  primaryUpdateMethod: switchover
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    # CNPG rejects unpinned tags (`latest`) via its admission webhook —
    # always pin a specific version.
    tag: "16.6-bookworm"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  enableSuperuserAccess: true
  superuserSecret:
    name: ""
  bootstrap:
    initdb:
      secret:
        name: ""
  postgresql:
    # Supabase's own services (Realtime CDC, pg_cron used by many self-host
    # setups) expect logical replication + these libraries. Add/remove as
    # your migrations require (e.g. postgis, pg_stat_statements).
    sharedPreloadLibraries: []
    parameters:
      max_connections: "300"
      shared_buffers: "512MB"
      work_mem: "8MB"
      maintenance_work_mem: "256MB"
      effective_cache_size: "1536MB"
      # Required by Realtime (CDC via logical replication).
      wal_level: logical
      max_wal_senders: "10"
      max_replication_slots: "10"
  storage:
    size: 50Gi
    storageClass: ""
  monitoring:
    # Requires the monitoring.coreos.com/v1 CRDs (Prometheus Operator).
    enablePodMonitor: false
  backup:
    enabled: false
    # Name of a pre-deployed ObjectStore CR (barmancloud.cnpg.io/v1).
    objectName: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  annotations: {}
  labels: {}

# =============================================================================
# PgDog — SQL-aware pooler/router in front of the CNPG cluster.
# -----------------------------------------------------------------------------
# Detects `BEGIN READ ONLY` / `BEGIN READ WRITE` (as sent by PostgREST based
# on function volatility) and routes accordingly: reads -> replicas, writes
# -> primary. Targets: PostgREST, Storage API, postgres-meta. Auth (pgx +
# transaction-pooling incompatibility) and Realtime (replication slots) and
# Edge Functions/migrations (long transactions, DDL) connect directly to the
# primary instead.
# =============================================================================
pgdog:
  enabled: true
  replicaCount: 2
  # PgDog's own listen port (internal). The Service always exposes 5432 so
  # DB_HOST/DB_PORT overrides on consumers stay drop-in compatible.
  port: 6432
  loadBalancingStrategy: "round_robin"
  # false = every query (including PostgREST's `BEGIN READ ONLY`) is routed
  # to the primary — no replica node declared at all. Requires
  # `cnpg.instances > 1` to have any effect when true.
  useReadReplicas: true
  # 0 = auto (number of available cores).
  workers: 0
  # LISTEN/NOTIFY backlog (used by Storage API).
  pubSubChannelSize: 4096
  extraGeneral: {}
  # Pool size per Postgres role. These are real Postgres connections PgDog
  # opens per (user, db) — keep the sum aligned with
  # `cnpg.postgresql.parameters.max_connections`. These four role names are
  # the standard Supabase Postgres roles — your migrations' bootstrap SQL
  # must create them (see README "Bootstrapping Supabase roles").
  pools:
    authenticator: 60
    supabaseAdmin: 10
    supabaseAuthAdmin: 15
    supabaseStorageAdmin: 15
    postgres: 5
  image:
    repository: ghcr.io/pgdogdev/pgdog
    tag: latest
    pullPolicy: Always
  # Renders users.toml from Secrets at pod start (never written to a ConfigMap
  # in plaintext).
  initImage:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  appDbSecretName: ""
  superuserSecretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  livenessProbe:
    tcpSocket:
      port: pgdog
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: pgdog
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null

# =============================================================================
# Edge Functions code / SQL migrations — mounted via Kubernetes ImageVolume.
# -----------------------------------------------------------------------------
# Build these as plain OCI images (`FROM scratch` + COPY your files, or any
# base — only the filesystem is used) and push them to any registry this
# cluster can pull from. No PVC, no custom application image required.
# =============================================================================
functionsCode:
  image:
    # Required. e.g. registry.example.com/myorg/supabase-functions:1.0.0
    reference: ""
    pullPolicy: Always
  # Path inside the functions container where the image's filesystem lands.
  # Layout expected: one directory per function, each with an `index.ts`
  # (e.g. `<mountPath>/hello-world/index.ts`).
  mountPath: /home/deno/functions

migrationsCode:
  image:
    # Required. e.g. registry.example.com/myorg/supabase-migrations:1.0.0
    reference: ""
    pullPolicy: Always
  # Path inside the migrations Job where the image's filesystem lands.
  # Layout expected: flat directory of `<version>_<name>.sql` files, applied
  # in lexicographic order. Your own Supabase role/schema bootstrap SQL
  # (roles, schemas, grants, extensions) belongs here as the first file —
  # see README "Bootstrapping Supabase roles".
  mountPath: /migrations

# =============================================================================
# Migrations runner — generic SQL runner, no Supabase-specific bootstrap
# baked in (see functionsCode/migrationsCode comment above).
# -----------------------------------------------------------------------------
# A plain Job (NOT a Helm hook — see templates/jobs/migrations.yaml for why),
# applied alongside the rest of the release. Tracks applied versions in
# `supabase_migrations.schema_migrations` (same convention as the Supabase
# CLI) so re-running `helm upgrade` is a no-op once a migration has applied.
# Connects directly to the CNPG primary with the superuser role (DDL/role
# creation cannot go through PgDog's transaction pooling).
# =============================================================================
migrations:
  enabled: true
  image:
    # Any image with `psql` + a POSIX shell. Debian-based `postgres` images
    # include bash; if you swap to an Alpine-based image, the runner script
    # is plain POSIX sh so it still works.
    repository: postgres
    tag: "16-bookworm"
    pullPolicy: IfNotPresent
  # Superuser Secret (basic-auth, key `password`). Empty = CNPG default
  # `{cluster}-superuser`.
  dbSecretName: ""
  waitForPostgresSeconds: 300
  # Job pod templates are immutable — if true (default), the Job name
  # includes the Helm release revision so `helm upgrade` (e.g. bumping
  # migrationsCode.image.reference) creates a fresh Job instead of failing
  # with "field is immutable". Old completed Jobs are garbage-collected via
  # ttlSecondsAfterFinished.
  appendReleaseRevisionToJobName: true
  ttlSecondsAfterFinished: 86400
  # Keep retrying: on first install the pod may sit in
  # CreateContainerConfigError for a bit until the CNPG Cluster (applied in
  # the same release) finishes creating its Secrets — that's expected, not a
  # real failure.
  backoffLimit: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  affinity: {}
  tolerations: []

# =============================================================================
# JWT — bring your own. Generate an HMAC secret + anon/service JWTs with any
# standard Supabase self-host JWT generator, store as a Secret with keys
# `secret` / `anonKey` / `serviceKey`, and point `jwt.secretName` at it
# (External Secrets / Sealed Secrets / kubectl — this chart doesn't mint it).
# =============================================================================
jwt:
  secretName: ""

# Optional asymmetric API keys (publishable/secret key pattern). Empty = HMAC
# keys only (jwt.secretName above). Fixed key contract if you do provide one:
# `jwtKeys`, `jwtJwks`, `supabasePublishableKey`, `supabaseSecretKey`.
jwtApiKeys:
  name: ""

# SMTP — shared by GoTrue (auth emails) and, if you enable it, Edge Functions.
# `enabled: false` (default): no mail sending configured anywhere.
smtp:
  enabled: false
  host: ""
  port: 587
  from: ""
  fromName: ""
  # Secret (basic-auth: username/password). Empty = no SMTP auth.
  secretName: ""

# App-level Secret whose keys are exposed as env vars to Edge Functions via
# `envFrom` (Stripe keys, third-party API keys, etc). Empty = not mounted.
config:
  secretName: ""

# =============================================================================
# Kong — single HTTP entrypoint (/rest/v1, /auth/v1, /storage/v1,
# /realtime/v1, /functions/v1, /pg).
# =============================================================================
kong:
  enabled: true
  replicaCount: 1
  # Publicly reachable URL of the Kong gateway (e.g. https://api.example.com).
  # Consumed by Auth (API_EXTERNAL_URL) and Studio (SUPABASE_PUBLIC_URL) as the
  # single source of truth for "how do external clients reach this API".
  # Empty = falls back to the in-cluster Service URL (fine for Studio/internal
  # use, but Auth email links/OAuth redirects need a real public URL).
  publicUrl: ""
  image:
    repository: kong
    tag: "3.8"
    pullPolicy: IfNotPresent
    pullSecrets: []
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null

# =============================================================================
# GoTrue (auth) — DB_HOST direct on the CNPG primary (pgx + PgDog transaction
# pooling incompatibility).
# =============================================================================
auth:
  enabled: true
  replicaCount: 1
  image:
    repository: supabase/gotrue
    tag: "v2.170.0"
    pullPolicy: IfNotPresent
    pullSecrets: []
  siteUrl: ""
  additionalRedirectUrls: ""
  disableSignup: false
  mailerAutoconfirm: false
  smsAutoconfirm: false
  jwtExpiry: 3600
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 9999
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null

# =============================================================================
# PostgREST (rest) — routed through PgDog.
# =============================================================================
rest:
  enabled: true
  replicaCount: 1
  image:
    repository: postgrest/postgrest
    tag: "v12.2.3"
    pullPolicy: IfNotPresent
    pullSecrets: []
  # Schemas exposed over the REST API.
  dbSchemas: "public,storage,graphql_public"
  dbAnonRole: anon
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null

# =============================================================================
# Realtime — DB_HOST direct on the primary (owns a logical replication slot;
# incompatible with a pooler).
# =============================================================================
realtime:
  enabled: true
  replicaCount: 1
  image:
    repository: supabase/realtime
    tag: "v2.34.40"
    pullPolicy: IfNotPresent
    pullSecrets: []
  # External ID for this Realtime "tenant" (multi-tenant mode is used even
  # for single-project self-host deployments).
  tenantExternalId: ""
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 4000
    annotations: {}
  autoscaling:
    # WebSockets = long-lived connections; scale-down should stay very
    # conservative. Enable Ingress session affinity before scaling > 1.
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  # SECRET_KEY_BASE (Erlang cookie/token signing). Empty = chart auto-generates
  # and persists one (`{release}-realtime`) across upgrades via `lookup`.
  encryptionSecret:
    name: ""

# =============================================================================
# Storage API — routed through PgDog. Defaults to local-disk backend (PVC);
# switch `s3.enabled: true` to use any S3-compatible backend instead.
# =============================================================================
storage:
  enabled: true
  replicaCount: 1
  image:
    repository: supabase/storage-api
    tag: "v1.11.13"
    pullPolicy: IfNotPresent
    pullSecrets: []
  fileSizeLimit: 524288000 # 500MiB
  # Local-disk backend (default). Ignored when s3.enabled=true.
  fileStorage:
    size: 20Gi
    storageClass: ""
  # S3-compatible backend (any provider — AWS S3, MinIO, Garage, OVH, etc.).
  s3:
    enabled: false
    endpoint: ""
    region: ""
    bucket: ""
    forcePathStyle: false
    # Secret with keys `keyId` / `accessKey`.
    secret:
      name: ""
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 5000
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# =============================================================================
# postgres-meta — admin API over the Postgres schema, consumed by Studio.
# Routed through PgDog.
# =============================================================================
meta:
  enabled: true
  replicaCount: 1
  image:
    repository: supabase/postgres-meta
    tag: "v0.84.2"
    pullPolicy: IfNotPresent
    pullSecrets: []
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  # Encryption key for postgres-meta's own secrets-at-rest feature. Empty =
  # chart auto-generates and persists one (`{release}-meta`).
  encryptionSecret:
    name: ""

# =============================================================================
# Studio — admin dashboard.
# =============================================================================
studio:
  enabled: true
  replicaCount: 1
  image:
    repository: supabase/studio
    tag: "20241028-b0eba90"
    pullPolicy: IfNotPresent
    pullSecrets: []
  organizationName: "Default Organization"
  projectName: "Default Project"
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  # Optional convenience mount so Studio's Edge Functions tab can list your
  # functions by reading the same code the Functions runtime executes. Off
  # by default — purely cosmetic, not required for functions to work.
  functionsCodeVolume:
    enabled: false
  # Basic-auth in front of Studio (also wired into Kong's `dashboard` route
  # when set). Empty = Studio/Kong dashboard route is unauthenticated —
  # put it behind an authenticated Ingress instead if you leave this unset.
  basicAuth:
    name: ""
  # Secret with key `apiKey`. Empty = Studio's AI panel is disabled.
  openAi:
    name: ""

# =============================================================================
# imgproxy — on-the-fly image transforms, consumed by Storage via IMGPROXY_URL.
# =============================================================================
imgproxy:
  enabled: true
  replicaCount: 1
  image:
    repository: darthsim/imgproxy
    tag: "v3.27.1"
    pullPolicy: IfNotPresent
    pullSecrets: []
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

# =============================================================================
# Edge Functions (Deno runtime). Code mounted read-only from
# `functionsCode.image.reference` via Kubernetes ImageVolume — see that
# section above. DB_HOST direct on the primary (long-running function
# invocations shouldn't hold transaction-pool slots).
# =============================================================================
functions:
  enabled: true
  replicaCount: 1
  image:
    repository: supabase/edge-runtime
    tag: "v1.67.4"
    pullPolicy: IfNotPresent
    pullSecrets: []
  # Whether the router verifies the caller's JWT itself before invoking a
  # function (in addition to / instead of Kong's key-auth in front of it).
  verifyJwt: false
  workerTimeoutMs: 180000
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  terminationGracePeriodSeconds: 30
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 9000
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
