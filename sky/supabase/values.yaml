# =============================================================================
# Edge Functions (Deno runtime). Code mounted read-only from
# `functionsCode.image.reference` via Kubernetes ImageVolume — see that
# section above. DB_HOST direct on the primary (long-running function
# invocations shouldn't hold transaction-pool slots).
# =============================================================================
functions:
  enabled: true
  # Container name override (default "<chart-name>-functions") - also what
  # Vector's log router matches against, see templates/deployments/vector.yaml.
  nameOverride: ""
  replicaCount: 1
  image:
    repository: supabase/edge-runtime
    tag: "v1.67.4"
    pullPolicy: IfNotPresent
    pullSecrets: []
  # Default JWT verification for functions NOT listed in `verifyJwt` below.
  # `true` matches Supabase Cloud, where `verify_jwt` defaults to true for
  # every function you don't opt out of in supabase/config.toml.
  #
  # Do not lower this casually: Kong deliberately does NOT put `key-auth` on
  # the /functions/v1 route (a function must be able to serve unauthenticated
  # webhook callers), so this router is the ONLY thing standing in front of
  # your functions. `false` here means every function is publicly invokable.
  verifyJwtDefault: true
  # Per-function overrides — a direct transcription of the
  # `[functions.<name>] verify_jwt = <bool>` blocks in supabase/config.toml.
  # Keep the two in sync: config.toml governs `supabase functions serve`
  # locally, this governs the deployed router.
  #   verifyJwt:
  #     stripe-webhook: false
  #     process-email-queue: true
  verifyJwt: {}
  # Per-invocation memory ceiling for a function worker. 256 matches Supabase
  # Cloud's default; the upstream self-host example uses 150, which OOM-kills
  # functions that are perfectly happy on Cloud.
  memoryLimitMb: 256
  workerTimeoutMs: 180000
  extraEnv: []
  envFrom: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  terminationGracePeriodSeconds: 30
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  service:
    type: ClusterIP
    port: 9000
    annotations: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    # HPA scaling behavior (autoscaling/v2), e.g. a long
    # stabilizationWindowSeconds to damp scale-down. Passed through as-is.
    behavior: {}

