gates:
  - name: pod-identity
    enabled: true
    check:
      type: http
      # readiness probe port of the Pod Identity agent — NOT 169.254.170.23,
      # which is the credential endpoint and 404s on /
      url: http://localhost:2703/readyz
      intervalSeconds: 3
      timeoutSeconds: 2
    actions:
      - type: removeTaint
        key: node.node-gate.io/pod-identity-not-ready
        effect: NoSchedule
      - type: setLabel
        key: node.node-gate.io/pod-identity-ready
        value: "true"
        # applied instead of `value` when the failsafe fires; defaults to "failsafe"
        failsafeValue: "failsafe"
    failsafe:
      timeoutSeconds: 120
      onTimeout: removeTaint
