apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "node-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-gate.labels" . | nindent 4 }}
data:
  run-gates.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    log() { echo "[$(date -u +%FT%TZ)] ${NODE_NAME}: $*"; }

    http_check() {
      local url="$1" timeout="$2"
      if command -v curl >/dev/null 2>&1; then
        curl -fsS -o /dev/null -m "${timeout}" "${url}"
        return $?
      fi
      if command -v wget >/dev/null 2>&1; then
        wget -q -T "${timeout}" -O /dev/null "${url}"
        return $?
      fi
      log "ERROR: curl or wget required for http checks"
      return 1
    }

    remove_taint() {
      local key="$1" effect="$2"
      kubectl taint node "${NODE_NAME}" "${key}:${effect}-" 2>/dev/null || true
    }

    set_label() {
      local key="$1" value="$2"
      kubectl label node "${NODE_NAME}" "${key}=${value}" --overwrite
    }

    remove_label() {
      local key="$1"
      kubectl label node "${NODE_NAME}" "${key}-" --overwrite 2>/dev/null || true
    }

    {{- range .Values.gates }}
    {{- if (.enabled | default true) }}
    {{- $gateName := .name }}
    # ── gate: {{ $gateName }} ──
    log "gate={{ $gateName }}: waiting for readiness"
  {{- $interval := .check.intervalSeconds | default 3 }}
  {{- $timeout := .check.timeoutSeconds | default 2 }}
  {{- $failsafe := .failsafe.timeoutSeconds | default 120 }}
  {{- $onTimeout := .failsafe.onTimeout | default "removeTaint" }}
    GATE_START=$(date +%s)
    GATE_OUTCOME=
    while true; do
      if \
  {{- if eq (.check.type | default "http") "http" }}
        http_check "{{ required "check.url is required for http gates" .check.url }}" "{{ $timeout }}"
  {{- else if eq .check.type "tcp" }}
        (echo >/dev/tcp/{{ .check.host }}/{{ .check.port }}) 2>/dev/null
  {{- else if eq .check.type "exec" }}
        {{ .check.command }}
  {{- else }}
        false
  {{- end }}
      then
        GATE_OUTCOME=ready
        log "gate={{ $gateName }}: check passed"
        break
      fi
      ELAPSED=$(( $(date +%s) - GATE_START ))
      if (( ELAPSED >= {{ $failsafe }} )); then
        GATE_OUTCOME=failsafe
        log "gate={{ $gateName }}: FAILSAFE timeout after {{ $failsafe }}s (onTimeout={{ $onTimeout }}) — check never passed"
        break
      fi
      sleep {{ $interval }}
    done

    # The two outcomes run DIFFERENT actions on purpose: a node that only ever hit the
    # failsafe must not end up labelled the same as one whose check actually passed,
    # or there is no way to tell a verified node from a timed-out one.
    if [[ "${GATE_OUTCOME}" == "ready" ]]; then
  {{- range .actions }}
  {{- if eq .type "removeTaint" }}
      remove_taint "{{ .key }}" "{{ .effect | default "NoSchedule" }}"
      log "gate={{ $gateName }}: removed taint {{ .key }}:{{ .effect | default "NoSchedule" }}"
  {{- else if eq .type "setLabel" }}
      set_label "{{ .key }}" "{{ .value }}"
      log "gate={{ $gateName }}: set label {{ .key }}={{ .value }}"
  {{- else if eq .type "removeLabel" }}
      remove_label "{{ .key }}"
      log "gate={{ $gateName }}: removed label {{ .key }}"
  {{- end }}
  {{- end }}
  {{- if eq $onTimeout "removeTaint" }}
    else
      # Fail-open: the check never passed, but the startup taint is cleared anyway so the
      # NodePool cannot deadlock. setLabel uses failsafeValue (default "failsafe") — the
      # label records the OUTCOME, never readiness. Nothing downstream should treat a
      # node labelled "failsafe" as verified.
  {{- range .actions }}
  {{- if eq .type "removeTaint" }}
      remove_taint "{{ .key }}" "{{ .effect | default "NoSchedule" }}"
      log "gate={{ $gateName }}: FAILSAFE removed taint {{ .key }}:{{ .effect | default "NoSchedule" }}"
  {{- else if eq .type "setLabel" }}
      set_label "{{ .key }}" "{{ .failsafeValue | default "failsafe" }}"
      log "gate={{ $gateName }}: FAILSAFE set label {{ .key }}={{ .failsafeValue | default "failsafe" }}"
  {{- else if eq .type "removeLabel" }}
      remove_label "{{ .key }}"
      log "gate={{ $gateName }}: FAILSAFE removed label {{ .key }}"
  {{- end }}
  {{- end }}
  {{- else }}
    else
      log "gate={{ $gateName }}: FAILSAFE onTimeout={{ $onTimeout }} — taint retained, no actions run"
  {{- end }}
    fi
    {{- end }}
    {{- end }}

    log "all gates complete — idling for pod lifetime"
    exec sleep infinity
