apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "node-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-gate.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "node-gate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "node-gate.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "node-gate.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 5 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gate-runner
          image: {{ include "node-gate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/scripts/run-gates.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "node-gate.fullname" . }}
            defaultMode: 0555
