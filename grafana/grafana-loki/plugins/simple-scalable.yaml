app:
  deploymentMode: SimpleScalable

  write:
    replicas: 1
    nodeSelector: {}
    tolerations: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 20
      targetCPUUtilizationPercentage: 95
      targetMemoryUtilizationPercentage: 80

    resources:
      limits:
        memory: "4Gi"

      requests:
        cpu: "500m"
        memory: "1Gi"

    # Use soft anti-affinity
    affinity: |
      podAntiAffinity:
        preferedDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                {{- include "loki.writeSelectorLabels" . | nindent 10 }}
            topologyKey: kubernetes.io/hostname

    persistence:
      enableStatefulSetAutoDeletePVC: true

  read:
    replicas: 1
    nodeSelector: {}
    tolerations: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 95
      targetMemoryUtilizationPercentage: 80

    resources:
      limits:
        memory: "4Gi"

      requests:
        cpu: "250m"
        memory: "512Mi"

    affinity: |
      podAntiAffinity:
        preferedDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                {{- include "loki.readSelectorLabels" . | nindent 10 }}
            topologyKey: kubernetes.io/hostname

    persistence:
      enableStatefulSetAutoDeletePVC: true

  backend:
    replicas: 1
    nodeSelector: {}
    tolerations: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 95

    resources:
      limits:
        memory: "4Gi"

      requests:
        cpu: "250m"
        memory: "512Mi"

    affinity: |
      podAntiAffinity:
        preferedDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                {{- include "loki.backendSelectorLabels" . | nindent 10 }}
            topologyKey: kubernetes.io/hostname

    persistence:
      enableStatefulSetAutoDeletePVC: true
