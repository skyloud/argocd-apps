app:
  deploymentMode: "SingleBinary"
  loki:
    commonConfig:
      replication_factor: 1

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    pattern_ingester:
      enabled: true

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true

    ruler:
      enable_api: true

  write:
    replicas: 0

  read:
    replicas: 0

  backend:
    replicas: 0

  ingester:
    replicas: 0

  querier:
    replicas: 0

  queryFrontend:
    replicas: 0

  queryScheduler:
    replicas: 0

  distributor:
    replicas: 0

  compactor:
    replicas: 0

  indexGateway:
    replicas: 0

  bloomCompactor:
    replicas: 0

  bloomGateway:
    replicas: 0

  resultsCache:
    enabled: false

  chunksCache:
    enabled: false

  singleBinary:
    replicas: 1
    nodeSelector: {}
    tolerations: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 20
      targetCPUUtilizationPercentage: 95

    resources:
      limits:
        memory: "2Gi"

      requests:
        cpu: "200m"
        memory: "512Mi"

    persistence:
      enableStatefulSetAutoDeletePVC: true
