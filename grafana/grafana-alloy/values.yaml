app:
  alloy:
    clustering:
      enabled: false

    controller:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations: []
    mounts:
      dockercontainers: true
      varlog: true
    resources:
      limits:
        cpu: 2500m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    serviceMonitor:
      enabled: true
    stabilityLevel: experimental