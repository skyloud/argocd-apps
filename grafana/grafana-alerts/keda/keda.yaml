apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: keda
spec:
  groups:
    - name: keda
      rules:
        - alert: KedaOperatorMetricsAbsent
          expr: |
            absent(keda_scaler_metrics_value) * on() group_left(env, tenant_id) group by (env, tenant_id) (up) > 0
          for: 30m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: No KEDA metrics available
            description: 'keda_scaler_metrics_value is absent: the KEDA operator is down, undeployed, or its ServiceMonitor is no longer discovered. Autoscaling is unmonitored and every KEDA alert of this pack is blind.'

        - alert: KedaScalerErrors
          expr: |
            sum by (scaler, scaledObject, exported_namespace) (
              rate(keda_scaler_detail_errors_total[15m])
            ) > 0
          for: 15m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: KEDA scaler failing for {{ $labels.exported_namespace }}/{{ $labels.scaledObject }} ({{ $labels.scaler }})
            description: 'Scaler {{ $labels.scaler }} has been returning errors continuously for 15 minutes ({{ printf "%.3f" $value }} errors/s). KEDA cannot read the trigger source, so the workload is no longer scaled on it.'

        - alert: KedaScaledObjectErrors
          expr: |
            sum by (scaledObject, exported_namespace) (
              rate(keda_scaled_object_errors_total[15m])
            ) > 0
          for: 15m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: KEDA ScaledObject in error in {{ $labels.exported_namespace }}/{{ $labels.scaledObject }}
            description: 'ScaledObject has been in error state continuously for 15 minutes ({{ printf "%.3f" $value }} errors/s). Its HPA is not being reconciled.'

        - alert: KedaScaledObjectAtMaxReplicas
          expr: |
            max by (exported_namespace, horizontalpodautoscaler) (
              kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~"keda-hpa-.*"}
            )
            >=
            max by (exported_namespace, horizontalpodautoscaler) (
              kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=~"keda-hpa-.*"}
            )
          for: 30m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: KEDA saturated at max replicas in {{ $labels.exported_namespace }}/{{ $labels.horizontalpodautoscaler }}
            description: 'HPA has been pinned at its maximum of {{ printf "%.0f" $value }} replicas for more than 30 minutes. The workload cannot scale further: raise maxReplicaCount or fix the downstream bottleneck.'
