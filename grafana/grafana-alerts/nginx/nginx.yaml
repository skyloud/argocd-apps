apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nginx
spec:
  groups:
    - name: nginx
      rules:
        - alert: NginxIngressMetricsAbsent
          expr: |
            absent_over_time(nginx_ingress_controller_requests[15m]) * on() group_left(env, tenant_id) group by (env, tenant_id) (up) > 0
          for: 5m
          keep_firing_for: 30m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: "No nginx ingress controller metric collected"
            description: "nginx_ingress_controller_requests has been absent for 15m: every alert of the nginx pack is blind. Check the ingress-nginx pods and their ServiceMonitor."

        - alert: TlsCertExpireIn10d
          expr: |
            min by (host, env, tenant_id) (
              nginx_ingress_controller_ssl_expire_time_seconds{host!="_"}
            ) - time() < 86400 * 10
          for: 15m
          keep_firing_for: 1h
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: "TLS certificate expires in less than 10 days for host {{ $labels.host }}"
            description: "The TLS certificate served by ingress-nginx for host {{ $labels.host }} expires in {{ $value | humanizeDuration }} (threshold 10d). Check the corresponding Certificate/Secret in the ingress namespace."

        - alert: MoreThanFive5xxIn10Mins
          expr: |
            (
              sum by (ingress, exported_namespace, env, tenant_id) (
                increase(nginx_ingress_controller_requests{controller_class="k8s.io/ingress-nginx",status=~"5.."}[10m])
              )
              > 25
            )
            and
            (
              sum by (ingress, exported_namespace, env, tenant_id) (
                increase(nginx_ingress_controller_requests{controller_class="k8s.io/ingress-nginx",status=~"5.."}[10m])
              )
              > 3 *
              avg_over_time(
                (
                  sum by (ingress, exported_namespace, env, tenant_id) (
                    increase(nginx_ingress_controller_requests{controller_class="k8s.io/ingress-nginx",status=~"5.."}[10m])
                  )
                )[1h:10m] offset 10m
              )
            )
          for: 5m
          keep_firing_for: 30m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: "HTTP 5xx burst on ingress {{ $labels.exported_namespace }}/{{ $labels.ingress }}"
            description: '{{ $value | printf "%.0f" }} HTTP 5xx in the last 10m (threshold 25), more than 3x the average of the previous hour.'

        - alert: HighErrorRate5xx
          expr: |
            sum by (ingress, exported_namespace, env, tenant_id) (
              rate(nginx_ingress_controller_requests{controller_class="k8s.io/ingress-nginx",status=~"5.."}[5m])
            )
            /
            sum by (ingress, exported_namespace, env, tenant_id) (
              rate(nginx_ingress_controller_requests{controller_class="k8s.io/ingress-nginx"}[5m])
            )
            > 0.05
          for: 2m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: "High HTTP 5xx error rate on ingress {{ $labels.exported_namespace }}/{{ $labels.ingress }}"
            description: "{{ $value | humanizePercentage }} of the requests answered 5xx over the last 5m (threshold 5%, sustained 2m). No minimum traffic guard: a single failing request on an idle ingress is enough to reach 100%. The 5m rate window is the minimum valid one at a 60s scrape interval."

        - alert: HighErrorCount401
          expr: |
            sum by (ingress, exported_namespace, env, tenant_id) (
              increase(nginx_ingress_controller_requests{controller_class="k8s.io/ingress-nginx",status="401"}[10m])
            )
            > 1000
          for: 5m
          keep_firing_for: 15m
          labels:
            alertowner: skyloud
            severity: medium
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: "High HTTP 401 count on ingress {{ $labels.exported_namespace }}/{{ $labels.ingress }}"
            description: '{{ $value | printf "%.0f" }} HTTP 401 in the last 10m (threshold 1000).'

        - alert: HighErrorCount403
          expr: |
            sum by (ingress, exported_namespace, env, tenant_id) (
              increase(nginx_ingress_controller_requests{controller_class="k8s.io/ingress-nginx",status="403"}[10m])
            )
            > 100
          for: 5m
          keep_firing_for: 15m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: "High HTTP 403 count on ingress {{ $labels.exported_namespace }}/{{ $labels.ingress }}"
            description: '{{ $value | printf "%.0f" }} HTTP 403 in the last 10m (threshold 100).'

        - alert: HighLatency90p20s
          expr: |
            histogram_quantile(
              0.9,
              sum by (le, ingress, exported_namespace, env, tenant_id) (
                rate(
                  nginx_ingress_controller_request_duration_seconds_bucket{controller_class="k8s.io/ingress-nginx"}[5m]
                )
              )
            ) > 20
          for: 5m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: "P90 latency above 20s on ingress {{ $labels.exported_namespace }}/{{ $labels.ingress }}"
            description: 'P90 request duration is {{ $value | printf "%.1f" }}s over the last 5m (threshold 20s).'
