apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox
spec:
  groups:
    - name: blackbox
      rules:
        - alert: BlackboxProbeFailure
          expr: |
            min by (env, tenant_id) (probe_success{job="blackbox/static"}) == 0
          for: 5m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: At least one blackbox probe is failing, failing target unknown
            description: "A probe of the job blackbox/static has been returning success=0 for more than 5 minutes. The collected series carry no label identifying the probed target: instance is the node hosting the Alloy pod, not the target, so the failing endpoint cannot be named here. Check manually every entry of app.blackbox_exporter.targets. Detection is also partial: all targets collapse into a single label set and overwrite each other, so some failures never reach the metric at all."

        - alert: BlackboxSlowProbe
          expr: |
            max by (env, tenant_id) (probe_duration_seconds{job="blackbox/static"}) > 15
          for: 5m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: At least one blackbox probe is slow, slow target unknown
            description: "A probe of the job blackbox/static took {{ $value | humanizeDuration }}, above the 15s budget, for more than 5 minutes. The collected series carry no label identifying the probed target, so the slow endpoint cannot be named here. Check manually every entry of app.blackbox_exporter.targets."
