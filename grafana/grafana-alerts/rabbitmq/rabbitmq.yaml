apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rabbitmq
spec:
  groups:
    - name: rabbitmq
      rules:
        - alert: RabbitmqExporterAbsent
          expr: |
            absent(rabbitmq_build_info) * on() group_left(env, tenant_id) group by (env, tenant_id) (up) > 0
          for: 15m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: No RabbitMQ metrics available
            description: 'rabbitmq_build_info is absent: the RabbitMQ cluster is down, undeployed, or its ServiceMonitor is no longer discovered. Every RabbitMQ alert of this pack is blind.'

        - alert: RabbitmqNodeDown
          expr: |
            count by (namespace, service) (rabbitmq_build_info)
            <
            max_over_time((count by (namespace, service) (rabbitmq_build_info))[3h:5m])
          for: 15m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ cluster lost a node in {{ $labels.namespace }}/{{ $labels.service }}
            description: '{{ printf "%.0f" $value }} node(s) reporting, below the maximum observed over the last 3h. A node is down or was removed from the cluster.'

        - alert: RabbitmqMemoryAlarm
          expr: |
            max by (namespace, pod) (rabbitmq_alarms_memory_used_watermark) == 1
          for: 5m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ memory alarm active on {{ $labels.namespace }}/{{ $labels.pod }}
            description: 'The node crossed its memory high watermark: RabbitMQ is blocking publishers until memory is released.'

        - alert: RabbitmqDiskAlarm
          expr: |
            max by (namespace, pod) (rabbitmq_alarms_free_disk_space_watermark) == 1
          for: 5m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ free disk space alarm active on {{ $labels.namespace }}/{{ $labels.pod }}
            description: 'Free disk space dropped below the configured limit: RabbitMQ is blocking publishers until space is reclaimed.'

        - alert: RabbitmqMemoryHigh
          expr: |
            rabbitmq_process_resident_memory_bytes / (rabbitmq_resident_memory_limit_bytes > 0) > 0.9
          for: 2m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ memory usage close to watermark on {{ $labels.namespace }}/{{ $labels.pod }}
            description: 'Node is using {{ $value | humanizePercentage }} of its memory high watermark for more than 2 minutes. Crossing 100% blocks publishers.'

        - alert: RabbitmqFileDescriptorsUsage
          expr: |
            rabbitmq_process_open_fds / (rabbitmq_process_max_fds > 0) > 0.9
          for: 10m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ file descriptors usage high on {{ $labels.namespace }}/{{ $labels.pod }}
            description: 'Node is using {{ $value | humanizePercentage }} of its file descriptor limit. Exhaustion refuses every new connection and channel.'

        - alert: RabbitmqTooManyConnections
          expr: |
            max by (namespace, pod) (rabbitmq_connections) > 5000
          for: 10m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ too many connections on {{ $labels.namespace }}/{{ $labels.pod }}
            description: '{{ printf "%.0f" $value }} open connections on this node for more than 10 minutes. Check for a client that does not pool or close its connections.'

        - alert: RabbitmqTooManyUnackMessages
          expr: |
            max by (namespace, vhost, queue) (rabbitmq_queue_messages_unacked) > 1000
          for: 15m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ too many unacknowledged messages on {{ $labels.namespace }} {{ $labels.vhost }}/{{ $labels.queue }}
            description: '{{ printf "%.0f" $value }} messages delivered but never acknowledged for more than 15 minutes. A consumer is stuck or its prefetch is too large.'

        - alert: RabbitmqNoQueueConsumer
          expr: |
            max by (namespace, vhost, queue) (rabbitmq_queue_consumers) < 1
          for: 1m
          labels:
            alertowner: skyloud
            severity: high
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ queue without consumer on {{ $labels.namespace }} {{ $labels.vhost }}/{{ $labels.queue }}
            description: 'Queue has no consumer for more than 1 minute. Server-generated queues (amq.gen-*) are not excluded and are a known source of noise on this rule.'

        - alert: RabbitmqUnroutableMessages
          expr: |
            sum by (namespace, pod) (
              increase(rabbitmq_channel_messages_unroutable_returned_total[5m])
              + increase(rabbitmq_channel_messages_unroutable_dropped_total[5m])
            ) > 0
          for: 2m
          keep_firing_for: 2h
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ unroutable messages on {{ $labels.namespace }}/{{ $labels.pod }}
            description: '{{ printf "%.0f" $value }} messages published to an exchange with no matching binding over the last 5 minutes. Dropped messages are lost silently: check exchange bindings and routing keys. The 5m window is the minimum valid one at a 60s scrape interval.'

        - alert: HighPendingMessages
          expr: |
            max by (namespace, vhost, queue) (
              rabbitmq_queue_messages_ready + rabbitmq_queue_messages_unacked
            ) > 50
          for: 5m
          labels:
            alertowner: skyloud
            severity: critical
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ backlog on {{ $labels.namespace }} {{ $labels.vhost }}/{{ $labels.queue }}
            description: '{{ printf "%.0f" $value }} messages pending (ready + unacked) for more than 5 minutes, threshold 50. max by queue is used instead of sum: quorum queue members each report the same depth, summing them multiplies it by the number of replicas.'

        - alert: RabbitmqInstancesDifferentVersions
          expr: |
            count by (namespace, service) (
              count by (namespace, service, rabbitmq_version) (rabbitmq_build_info)
            ) > 1
          for: 1h
          labels:
            alertowner: skyloud
            severity: medium
          annotations:
            tenant_id: "{{ $labels.tenant_id }}"
            env: "{{ $labels.env }}"
            summary: RabbitMQ version skew in {{ $labels.namespace }}/{{ $labels.service }}
            description: '{{ printf "%.0f" $value }} distinct RabbitMQ versions in the same cluster for more than 1 hour. A rolling upgrade is stuck or a node failed to restart.'
